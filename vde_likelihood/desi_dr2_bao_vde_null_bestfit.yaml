# Conditional DESI DR2 BAO-only maximum-likelihood fit for the nested null Omega_X=0.
likelihood:
  bao.desi_dr2: null

theory:
  classy:
    path: global
    extra_args:
      Omega_k: -0.01
      omega_b: 0.02237

params:
  Omega_fld: 0.0
  H0:
    prior: {min: 55.0, max: 85.0}
    ref: 69.0
    proposal: 0.5
  omega_cdm:
    prior: {min: 0.08, max: 0.16}
    ref: 0.114
    proposal: 0.002
  Omega_Lambda:
    derived: true
  Omega_m:
    derived: true
  rs_drag:
    derived: true

sampler:
  minimize:
    method: bobyqa
    ignore_prior: true
    best_of: 4
    max_evals: 20000
    override_bobyqa:
      rhoend: 0.00001

output: vde_likelihood/results/profile/null
force: true
