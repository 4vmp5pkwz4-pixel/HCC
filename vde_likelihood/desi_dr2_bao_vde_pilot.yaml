# Real DESI DR2 BAO-only pilot posterior for the validated closed-S3 canonical VDE lift.
# Scope: conditional pilot, NOT the final CMB+BAO+SNe+lensing likelihood.
# Fixed compact curvature: Omega_k = -0.01.
# Sampled: Omega_X (=Omega_fld), H0, omega_cdm. omega_b fixed.

likelihood:
  bao.desi_dr2: null

theory:
  classy:
    path: global
    extra_args:
      Omega_k: -0.01
      omega_b: 0.02237
      w0_fld: -0.6666666666666666
      wa_fld: 0.0
      cs2_fld: 1.0
      use_ppf: false

params:
  Omega_fld:
    prior:
      min: 0.0
      max: 0.30
    ref:
      dist: norm
      loc: 0.03
      scale: 0.015
    proposal: 0.01
    latex: \Omega_X

  H0:
    prior:
      min: 55.0
      max: 85.0
    ref:
      dist: norm
      loc: 67.4
      scale: 2.0
    proposal: 1.0
    latex: H_0

  omega_cdm:
    prior:
      min: 0.08
      max: 0.16
    ref:
      dist: norm
      loc: 0.12
      scale: 0.005
    proposal: 0.003
    latex: \omega_c

  Omega_Lambda:
    derived: true
    latex: \Omega_\Lambda

  Omega_m:
    derived: true
    latex: \Omega_m

  rs_drag:
    derived: true
    latex: r_d

sampler:
  mcmc:
    max_samples: 8000
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.15
    max_tries: 2000
    learn_proposal: true
    output_every: 60s

output: vde_likelihood/results/desi_dr2_bao_vde_pilot
force: true
