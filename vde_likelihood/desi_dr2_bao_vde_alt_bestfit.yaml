# Conditional DESI DR2 BAO-only maximum-likelihood fit for canonical VDE.
likelihood:
  bao.desi_dr2: null

theory:
  classy:
    path: global
    extra_args:
      Omega_k: -0.01
      omega_b: 0.02237
      w0_fld: -0.6666666666666666
      wa_fld: 0.0
      cs2_fld: 1.0
      use_ppf: false

params:
  Omega_fld:
    prior: {min: 0.0, max: 0.30}
    ref: 0.18
    proposal: 0.01
    latex: \Omega_X
  H0:
    prior: {min: 55.0, max: 85.0}
    ref: 66.25
    proposal: 0.5
  omega_cdm:
    prior: {min: 0.08, max: 0.16}
    ref: 0.1063
    proposal: 0.002
  Omega_Lambda:
    derived: true
  Omega_m:
    derived: true
  rs_drag:
    derived: true

sampler:
  minimize:
    method: bobyqa
    ignore_prior: true
    best_of: 4
    max_evals: 20000
    override_bobyqa:
      rhoend: 0.00001

output: vde_likelihood/results/profile/alt
force: true
