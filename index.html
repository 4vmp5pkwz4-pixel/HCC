<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================================================================
   КОНСТАНТЫ МОДЕЛИ — фидуциальные значения из Таблицы статьи
   (R = (c/H0)/sqrt(|Ωk|), |Ωk| = 0.0007, H0 = 67.4 км/с/Мпк)
   ================================================================ */
const S3 = {
  R:          548.324513026856,     // Gly — радиус кривизны S³
  tR:         548.324513026856,     // Gyr — световое время радиуса
  Dembed:     1096.649026053712,    // Gly — диаметр вложения 2R (в R⁴)
  Dcausal:    1722.612261908368,    // Gly — внутренний причинный диаметр πR
  Circ:       3445.224523816736,    // Gly — большая окружность 2πR
  V:          3.254188648717e9,     // Gly³ — собственный объём 2π²R³
  K:          3.326018624722e-6,    // Gly⁻² — секционная кривизна 1/R²
  R3scalar:   1.995611174833e-5,    // Gly⁻² — скалярная кривизна 6/R²
  tCoh:       1722.612261908368,    // Gyr — время полной причинной доступности πR/c
  t0:         13.787718785602,      // Gyr — возраст горячей истории
  theta0deg:  1.440712710740,       // ° — дуга ct0 на большой окружности
  Dparticle:  46.125169765204,      // Gly — горизонт частиц (фоново-зависимый вход)
  thetaPdeg:  4.819732647519,       // ° — дуга горизонта частиц
  chiP:       0.08412,              // рад — D_particle / R
  GammaObs:   1.2613777438877e-4,   // объёмная доля наблюдаемого домена
  GammaST:    4.255135e-10,         // совместный диагностический продукт
  OmegaK:     -0.0007,
  H0:         67.4,
};
// Γ(χ) = (χ - sin2χ/2)/π — доля объёма S³ в геодезическом шаре радиуса χR
const Gamma = chi => (chi - 0.5*Math.sin(2*chi)) / Math.PI;
// A(χ) = 4πR² sin²χ — площадь сферического экрана S²_χ
const screenArea = chi => 4*Math.PI*S3.R*S3.R*Math.sin(chi)**2;

/* ================================================================
   ЭЛЕМЕНТЫ ОРБИТ ПЛАНЕТ (J2000, JPL approximate ephemerides)
   a[а.е.], e, i[°], L[°], ϖ[°], Ω[°]; rate — dL/dT [°/век]
   ================================================================ */
const PLANETS = [
 {name:'Меркурий', a:0.38709927, e:0.20563593, i:7.00497902,  L:252.25032350, w:77.45779628,  O:48.33076593,  rate:149472.67411175, r:2439.7,  col:0x9c8e7d},
 {name:'Венера',   a:0.72333566, e:0.00677672, i:3.39467605,  L:181.97909950, w:131.60246718, O:76.67984255,  rate:58517.81538729,  r:6051.8,  col:0xd9b67a},
 {name:'Земля',    a:1.00000261, e:0.01671123, i:-0.00001531, L:100.46457166, w:102.93768193, O:0.0,          rate:35999.37244981,  r:6371.0,  col:0x4d7fd0},
 {name:'Марс',     a:1.52371034, e:0.09339410, i:1.84969142,  L:-4.55343205,  w:-23.94362959, O:49.55953891,  rate:19140.30268499,  r:3389.5,  col:0xc4663a},
 {name:'Юпитер',   a:5.20288700, e:0.04838624, i:1.30439695,  L:34.39644051,  w:14.72847983,  O:100.47390909, rate:3034.74612775,   r:69911,   col:0xc8a06c},
 {name:'Сатурн',   a:9.53667594, e:0.05386179, i:2.48599187,  L:49.95424423,  w:92.59887831,  O:113.66242448, rate:1222.49362201,   r:58232,   col:0xe0c89a, rings:true},
 {name:'Уран',     a:19.18916464,e:0.04725744, i:0.77263783,  L:313.23810451, w:170.95427630, O:74.01692503,  rate:428.48202785,    r:25362,   col:0x86c5d8},
 {name:'Нептун',   a:30.06992276,e:0.00859048, i:1.77004347,  L:-55.12002969, w:44.96476227,  O:131.78422574, rate:218.45945325,    r:24622,   col:0x4666c8},
 {name:'Плутон',   a:39.48211675,e:0.24882730, i:17.14001206, L:238.92903833, w:224.06891629, O:110.30393684, rate:145.20780515,    r:1188.3,  col:0xb8a690, dwarf:true},
];
const SUN = { r:695700, col:0xfff2c4 };       // км
const KM_PER_AU = 1.495978707e8;
const DEG = Math.PI/180;

/* ============================== РЕНДЕР ============================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
app.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'fixed',inset:'0',pointerEvents:'none',zIndex:'5'});
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1e-5, 1e6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

function mkLabel(text, cls='label'){
  const div = document.createElement('div'); div.className = cls; div.textContent = text;
  return new CSS2DObject(div);
}
function starfield(n, radius){
  const g = new THREE.BufferGeometry(); const pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const v = new THREE.Vector3().randomDirection().multiplyScalar(radius*(0.7+0.3*Math.random()));
    pos.set([v.x,v.y,v.z], i*3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  return new THREE.Points(g, new THREE.PointsMaterial({color:0x9db4d8,size:1.2,sizeAttenuation:false,transparent:true,opacity:.7}));
}

/* ================================================================
   РЕЖИМ 1 · СОЛНЕЧНАЯ СИСТЕМА  (1 ед. сцены = 1 а.е.)
   Кеплеровы орбиты: M = L − ϖ; решение уравнения Кеплера (Ньютон).
   ================================================================ */
const solarGroup = new THREE.Group(); scene.add(solarGroup);
solarGroup.add(starfield(2600, 300));

const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 32),
  new THREE.MeshBasicMaterial({color:SUN.col})
);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture(), color:0xffdf90, transparent:true, opacity:.85, depthWrite:false}));
sunMesh.add(sunGlow);
sunMesh.add(mkLabel('Солнце','label major'));
solarGroup.add(sunMesh);
solarGroup.add(new THREE.PointLight(0xfff4e0, 2.2, 0, 0));
solarGroup.add(new THREE.AmbientLight(0x404a60, .55));

function glowTexture(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,4,64,64,64);
  g.addColorStop(0,'rgba(255,240,200,1)'); g.addColorStop(.35,'rgba(255,200,110,.45)');
  g.addColorStop(1,'rgba(255,180,80,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

// Решение уравнения Кеплера M = E − e·sinE
function keplerE(M, e){
  let E = e < .8 ? M : Math.PI;
  for(let k=0;k<12;k++){
    const d = (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E));
    E -= d; if(Math.abs(d) < 1e-12) break;
  }
  return E;
}
// Гелиоцентрическая позиция (эклиптика J2000) в а.е.; T — юлианские века от J2000
function planetPos(p, T){
  const L = (p.L + p.rate*T)*DEG, w = p.w*DEG, O = p.O*DEG, i = p.i*DEG, e = p.e;
  let M = L - w; M = ((M + Math.PI)%(2*Math.PI) + 2*Math.PI)%(2*Math.PI) - Math.PI;
  const E = keplerE(M, e);
  const xp = p.a*(Math.cos(E)-e), yp = p.a*Math.sqrt(1-e*e)*Math.sin(E);
  const wo = w - O, cw=Math.cos(wo), sw=Math.sin(wo), cO=Math.cos(O), sO=Math.sin(O), ci=Math.cos(i), si=Math.sin(i);
  const x = (cw*cO - sw*sO*ci)*xp + (-sw*cO - cw*sO*ci)*yp;
  const y = (cw*sO + sw*cO*ci)*xp + (-sw*sO + cw*cO*ci)*yp;
  const z = (sw*si)*xp + (cw*si)*yp;
  return new THREE.Vector3(x, z, -y);  // эклиптика → сцена (Y вверх)
}

const planetObjs = [];
for(const p of PLANETS){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, 36, 24),
    new THREE.MeshStandardMaterial({color:p.col, roughness:.85, metalness:.05})
  );
  if(p.rings){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.24, 2.27, 96),
      new THREE.MeshBasicMaterial({color:0xcdb88e, side:THREE.DoubleSide, transparent:true, opacity:.55})
    );
    ring.rotation.x = Math.PI/2 - 26.7*DEG;
    mesh.add(ring);
  }
  mesh.add(mkLabel(p.name, p.dwarf?'label dim':'label'));
  solarGroup.add(mesh);

  // линия орбиты — полный оборот по эксцентрической аномалии
  const pts = [];
  for(let k=0;k<=256;k++){
    const E = k/256*2*Math.PI;
    const nu = 2*Math.atan2(Math.sqrt(1+p.e)*Math.sin(E/2), Math.sqrt(1-p.e)*Math.cos(E/2));
    // позиция через истинную аномалию: используем элементы при T=0
    const rr = p.a*(1-p.e*Math.cos(E));
    const w=p.w*DEG, O=p.O*DEG, i=p.i*DEG, wo=w-O;
    const xq = rr*Math.cos(nu), yq = rr*Math.sin(nu);
    const cw=Math.cos(wo), sw=Math.sin(wo), cO=Math.cos(O), sO=Math.sin(O), ci=Math.cos(i), si=Math.sin(i);
    const x=(cw*cO-sw*sO*ci)*xq+(-sw*cO-cw*sO*ci)*yq;
    const y=(cw*sO+sw*cO*ci)*xq+(-sw*sO+cw*cO*ci)*yq;
    const z=(sw*si)*xq+(cw*si)*yq;
    pts.push(new THREE.Vector3(x, z, -y));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:p.col, transparent:true, opacity:p.dwarf?.3:.45})
  );
  solarGroup.add(line);
  planetObjs.push({p, mesh, line});
}

// Пояс астероидов 2.1–3.3 а.е.
{
  const n = 3500, g = new THREE.BufferGeometry(), pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a = 2.1 + Math.random()*1.2, th = Math.random()*2*Math.PI;
    const z = (Math.random()-.5)*.25;
    pos.set([a*Math.cos(th), z, a*Math.sin(th)], i*3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const belt = new THREE.Points(g, new THREE.PointsMaterial({color:0x8a7f6e,size:.012,transparent:true,opacity:.6}));
  solarGroup.add(belt);
}

/* ================================================================
   РЕЖИМ 2 · НАБЛЮДАЕМАЯ ВСЕЛЕННАЯ  (1 ед. сцены = 1 Gly)
   Световые сферы-экраны S²_χ(p): ct0, S²_LSS, S²_ph (статья, §Light-Sphere Screens)
   ================================================================ */
const obsGroup = new THREE.Group(); obsGroup.visible=false; scene.add(obsGroup);

function screenSphere(radius, color, opacity, name, dashed=false){
  const grp = new THREE.Group();
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 64, 40),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity, side:THREE.BackSide, depthWrite:false})
  );
  grp.add(mesh);
  const wire = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 36, 22),
    new THREE.MeshBasicMaterial({color, wireframe:true, transparent:true, opacity:opacity*2.2, depthWrite:false})
  );
  grp.add(wire);
  const lab = mkLabel(name,'label major'); lab.position.set(0, radius*1.02, 0); grp.add(lab);
  return grp;
}
const sphCT0 = screenSphere(S3.t0,        0xffa64d, .05, `ct₀ = ${S3.t0.toFixed(2)} Gly (световой возраст)`);
const sphLSS = screenSphere(45.4,         0xd05ad8, .04, 'S²_LSS — экран последнего рассеяния (~45.4 Gly, фоново-зависимый)');
const sphPH  = screenSphere(S3.Dparticle, 0x4da2ff, .05, `S²_ph — горизонт частиц D = ${S3.Dparticle.toFixed(2)} Gly`);
obsGroup.add(sphCT0, sphLSS, sphPH);

// наблюдатель (Млечный Путь)
{
  const dot = new THREE.Mesh(new THREE.SphereGeometry(.25,16,12), new THREE.MeshBasicMaterial({color:0xffffff}));
  dot.add(mkLabel('наблюдатель p (Млечный Путь)','label major'));
  obsGroup.add(dot);
}
// крупномасштабная структура — точки-галактики внутри шара B³_χ(p)
{
  const n = 24000, g = new THREE.BufferGeometry(), pos = new Float32Array(n*3), col = new Float32Array(n*3);
  const c1 = new THREE.Color(0xaac4ee), c2 = new THREE.Color(0xeec9a0);
  let i = 0;
  // имитация скучивания: кластерные центры + рассеяние
  const centers = [];
  for(let k=0;k<260;k++){
    const v = new THREE.Vector3().randomDirection().multiplyScalar(S3.Dparticle*Math.cbrt(Math.random()));
    centers.push(v);
  }
  while(i<n){
    const c = centers[(Math.random()*centers.length)|0];
    const v = new THREE.Vector3().randomDirection().multiplyScalar(Math.pow(Math.random(),1.6)*4.5).add(c);
    if(v.length()>S3.Dparticle) continue;
    pos.set([v.x,v.y,v.z], i*3);
    const t = Math.random(), cc = c1.clone().lerp(c2,t);
    col.set([cc.r,cc.g,cc.b], i*3);
    i++;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  obsGroup.add(new THREE.Points(g, new THREE.PointsMaterial({size:.18,vertexColors:true,transparent:true,opacity:.75})));
}

/* ================================================================
   РЕЖИМ 3 · ГЛОБАЛЬНЫЙ НОСИТЕЛЬ S³  (1 ед. сцены = 100 Gly)
   Большое 2-сферное сечение S³; экран S²_χ как окружность; фотон
   вдоль большой окружности; расслоение Хопфа (стереопроекция).
   ================================================================ */
const s3Group = new THREE.Group(); s3Group.visible=false; scene.add(s3Group);
const RU = S3.R/100;   // радиус в единицах сцены

const sectionGroup = new THREE.Group(); s3Group.add(sectionGroup);
{
  // полупрозрачная сфера — большое 2-сферное сечение S³ (аналогия-визуализация)
  const sph = new THREE.Mesh(
    new THREE.SphereGeometry(RU, 96, 64),
    new THREE.MeshPhongMaterial({color:0x16345e, transparent:true, opacity:.32, shininess:18, side:THREE.FrontSide})
  );
  sectionGroup.add(sph);
  const wire = new THREE.Mesh(
    new THREE.SphereGeometry(RU*1.0005, 48, 30),
    new THREE.MeshBasicMaterial({color:0x3f6fb6, wireframe:true, transparent:true, opacity:.10})
  );
  sectionGroup.add(wire);
  sectionGroup.add(new THREE.AmbientLight(0x8090b0,.8));
  const dl = new THREE.DirectionalLight(0xffffff,.7); dl.position.set(3,5,4); sectionGroup.add(dl);
  s3Group.add(starfield(2000, RU*40));
}

// точка наблюдателя на «северном полюсе» сечения
const obsPoint = new THREE.Vector3(0, RU, 0);
{
  const dot = new THREE.Mesh(new THREE.SphereGeometry(RU*.012,16,12), new THREE.MeshBasicMaterial({color:0xffffff}));
  dot.position.copy(obsPoint);
  dot.add(mkLabel('наблюдатель p','label major'));
  sectionGroup.add(dot);
  const anti = new THREE.Mesh(new THREE.SphereGeometry(RU*.012,16,12), new THREE.MeshBasicMaterial({color:0xff6a6a}));
  anti.position.set(0,-RU,0);
  anti.add(mkLabel('антипод −p (d = πR = 1722.6 Gly)','label dim'));
  sectionGroup.add(anti);
}

// наблюдаемый домен — сферическая шапка χ_particle = 0.08412 рад
function capMesh(chi, color, opacity){
  const g = new THREE.SphereGeometry(RU*1.002, 64, 32, 0, 2*Math.PI, 0, chi);
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false}));
}
const obsCap = capMesh(S3.chiP, 0x53b1ff, .85);
obsCap.add((()=>{const l=mkLabel(`наблюдаемая Вселенная · θ = ${S3.thetaPdeg.toFixed(2)}° · Γ = 0.0126 %`,'label major');
  l.position.set(0, RU*1.06, 0); return l;})());
sectionGroup.add(obsCap);

// большая окружность через наблюдателя (C = 2πR) + фотон
{

// экран S²_χ — окружность геодезического радиуса χ вокруг наблюдателя
const chiRing = (()=>{
  const g = new THREE.BufferGeometry();
  const m = new THREE.LineBasicMaterial({color:0x7ef0c2, transparent:true, opacity:.95});
  const l = new THREE.LineLoop(g,m); sectionGroup.add(l);
  l.userData.label = mkLabel('','label'); l.add(l.userData.label);
  return l;
})();
function setChiRing(chi){
  const n=128, pts=[];
  const s = Math.sin(chi), c = Math.cos(chi);
  for(let k=0;k<n;k++){
    const a=k/n*2*Math.PI;
    pts.push(new THREE.Vector3(RU*s*Math.cos(a), RU*c, RU*s*Math.sin(a)));
  }
  chiRing.geometry.setFromPoints(pts);
  chiRing.userData.label.position.set(RU*s*1.06, RU*c, 0);
  chiRing.userData.label.element.textContent =
    `S²_χ · χ=${chi.toFixed(3)} рад · d=${(chi*S3.R).toFixed(1)} Gly · A=${screenArea(chi).toExponential(2)} Gly² · Γ=${(Gamma(chi)*100).toPrecision(3)} %`;
}

// Расслоение Хопфа — стереографическая проекция волокон S¹ ⊂ S³ → R³
const hopfGroup = new THREE.Group(); hopfGroup.visible=false; s3Group.add(hopfGroup);
{
  const fibers = [];
  const RINGS = [[.25,6],[ .5,10],[ .75,14],[1.05,18],[1.35,14],[1.6,10],[1.85,6]]; // [θ базовой точки, число волокон]
  for(const [theta,count] of RINGS){
    for(let j=0;j<count;j++){
      const phi = j/count*2*Math.PI;
      fibers.push([theta,phi]);
    }
  }
  for(const [theta,phi] of fibers){
    const pts=[];
    const ch = Math.cos(theta/2), sh = Math.sin(theta/2);
    for(let k=0;k<=160;k++){
      const t = k/160*2*Math.PI;
      // точка на S³ ⊂ C²: (cos(θ/2)·e^{i(t+φ)}, sin(θ/2)·e^{it})
      const x1 = ch*Math.cos(t+phi), x2 = ch*Math.sin(t+phi);
      const x3 = sh*Math.cos(t),     x4 = sh*Math.sin(t);
      // стереопроекция из (0,0,0,1)
      const d = 1 - x4 + 1e-9;
      pts.push(new THREE.Vector3(x1/d, x2/d, x3/d).multiplyScalar(RU*.55));
    }
    const col = new THREE.Color().setHSL(theta/2/Math.PI*2.2%1, .75, .6);
    hopfGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.8})));
  }
  const hl = mkLabel('Расслоение Хопфа S¹ ↪ S³ → S² (стереографическая проекция)','label major');
  hl.position.set(0, RU*1.2, 0); hopfGroup.add(hl);
}

const state = {

function fmtDate(jdFromJ2000){
  const ms = (jdFromJ2000 + 2451545.0 - 2440587.5)*86400000;
  const d = new Date(ms);
  return isFinite(d) ? d.toISOString().slice(0,10) : '—';
}

function buildCtl(){
  if(state.mode==='solar'){
    ctl.innerHTML = `

    ctl.querySelector('#spd').oninput = e=>{ state.daysPerSec = 10**(+e.target.value); updCtlVals(); };

      <div class="ctlrow"><label>S²_LSS (≈45.4 Gly)</label><input type="checkbox" id="s2" checked></div>

    </div>
    <div class="note" style="color:var(--dim);font-size:11px;margin-top:6px">

      ∂S³_R = ∅. Сагитта кривизны на диаметре 92.25 Gly — всего 1.94 Gly:
      локальная картина почти плоская.</div>`;
    ctl.querySelector('#s1').onchange = e=>sphCT0.visible=e.target.checked;
    ctl.querySelector('#s2').onchange = e=>sphLSS.visible=e.target.checked;
    ctl.querySelector('#s3c').onchange = e=>sphPH.visible=e.target.checked;
  }
  else {
    ctl.innerHTML = `
    <div class="sect"><b>Экран S²_χ — «граница без границы»</b>
      <div class="ctlrow"><label>χ (геодез. радиус)</label>
        <input type="range" id="chi" min="0.005" max="${Math.PI.toFixed(3)}" step="0.001" value="${state.chi}">
        <span class="val" id="chiV"></span></div>
      <div class="ctlrow">

      затем стягивается к антиподу: компактность без края. Γ(χ)=(χ−sin2χ/2)/π —
      точная доля объёма S³. Полная причинная доступность: t_coh = πR/c = 1722.6 Gyr.</div>`;
    ctl.querySelector('#chi').oninput = e=>{ state.chi=+e.target.value; setChiRing(state.chi); updCtlVals(); };
    ctl.querySelector('#chiP').onclick = ()=>{ state.chi=S3.chiP; ctl.querySelector('#chi').value=state.chi; setChiRing(state.chi); updCtlVals(); };

function updCtlVals(){
  const q = s=>ctl.querySelector(s);
  if(state.mode==='solar'){
    if(q('#spdV')) q('#spdV').textContent = state.daysPerSec>=365 ?
      (state.daysPerSec/365.25).toFixed(1)+' лет/с' : state.daysPerSec.toPrecision(3)+' сут/с';
    if(q('#pscV')) q('#pscV').textContent = state.trueScale ? '×1 (1:1)' : '×'+Math.round(state.planetScale);
  } else if(state.mode==='s3'){
    if(q('#chiV')) q('#chiV').textContent = state.chi.toFixed(3)+' рад';
    if(q('#gpsV')) q('#gpsV').textContent = state.gyrPerSec.toPrecision(3);
  }
}

function setMode(mode){
  state.mode = mode;
  solarGroup.visible = mode==='solar';
  obsGroup.visible   = mode==='obs';
  s3Group.visible    = mode==='s3';
  document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  if(mode==='solar'){
    camera.near=1e-4; camera.far=2e4; camera.position.set(0,26,52); controls.target.set(0,0,0);
    controls.minDistance=.01; controls.maxDistance=900;
  } else if(mode==='obs'){
    camera.near=.05; camera.far=5e3; camera.position.set(0,55,118); controls.target.set(0,0,0);
    controls.minDistance=1; controls.maxDistance=600;
    sectionGroup.visible = true;
  } else {
    camera.near=.05; camera.far=5e3; camera.position.set(0,8,17); controls.target.set(0,0,0);
    controls.minDistance=.5; controls.maxDistance=120;
    hopfGroup.visible = state.hopf; sectionGroup.visible = !state.hopf;
    setChiRing(state.chi);
  }
  camera.updateProjectionMatrix();
  buildCtl();
}
document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('togglePanels').onclick = ()=>{
  const hidden = ctl.style.display==='none';
  ctl.style.display = info.style.display = hidden?'block':'none';
};

/* ============================== ЦИКЛ ============================== */
let last = performance.now();
function tick(now){
  const dt = Math.min((now-last)/1000, .1); last = now;

  if(state.mode==='solar'){
    if(!state.paused) state.epochDays += state.daysPerSec*dt;
    const T = state.epochDays/36525;
    const pScale = state.trueScale ? 1 : state.planetScale;
    const sScale = state.trueScale ? 1 : state.sunScale;
    sunMesh.scale.setScalar(SUN.r/KM_PER_AU*sScale);
    sunGlow.scale.setScalar(state.trueScale ? 6 : 4.2);
    for(const o of planetObjs){
      o.mesh.position.copy(planetPos(o.p, T));
      o.mesh.scale.setScalar(o.p.r/KM_PER_AU*pScale);
    }
    hudBig.textContent = fmtDate(state.epochDays);
    hudSub.textContent = 'гелиоцентрическая эклиптика J2000 · 1 ед. = 1 а.е.';
  }
  else if(state.mode==='obs'){
    hudBig.textContent = `Γ_obs = 0.0126 % объёма S³ · θ_particle = 4.82°`;
    hudSub.textContent = '1 ед. = 1 Gly · домен D_obs(p,T) ⊂ S³_R · экраны = границы реконструкции';
  }
  else {
    if(state.photonRun && !state.hopf){
      state.photonT += state.gyrPerSec*dt;
      if(state.photonT > S3.Circ) state.photonT -= S3.Circ;  // полный обход 2πR/c
    }
    const a = state.photonT/S3.R;  // пройденная дуга в радианах
    photon.position.set(RU*Math.sin(a), RU*Math.cos(a), 0);
    // след фотона
    const n = Math.max(2, Math.min(257, Math.floor(a/(2*Math.PI)*256)+2));
    const tp = [];
    for(let k=0;k<n;k++){
      const aa = Math.min(a, k/(n-1)*a);
      tp.push(new THREE.Vector3(RU*1.003*Math.sin(aa), RU*1.003*Math.cos(aa), 0));
    }
    photonTrail.geometry.setFromPoints(tp);
    const GT = Gamma(Math.min(a, Math.PI));
    hudBig.textContent = state.hopf
      ? 'S³ ≅ SU(2) · волокна Хопфа — окружности Вилларсо вложенных торов'
      : `t = ${state.photonT.toFixed(1)} Gyr · дуга ${(a/DEG).toFixed(1)}° · Γ(T) = ${(GT*100).toFixed(2)} % ${a>=Math.PI?'· ПОЛНАЯ ПРИЧИННАЯ ДОСТУПНОСТЬ (t ≥ t_coh)':''}`;
    hudSub.textContent = '1 ед. = 100 Gly · R = 548.32 Gly · t_coh = πR/c = 1722.6 Gyr · ∂S³_R = ∅';
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
setMode('solar');
requestAnimationFrame(tick);
