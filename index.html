<!DOCTYPE html>
<html lang="en">

<style>
  :root{
    --bg:#02040a;
    --gold:#d4af6a; --gold-2:#f1dda6; --gold-dim:rgba(212,175,106,.34);
    --panel:linear-gradient(165deg, rgba(14,18,30,.93), rgba(6,8,15,.9));
    --border:rgba(212,175,106,.26);
    --txt:#e9e6dc; --dim:#97a0b6; --acc:#d4af6a; --warn:#e8b86a; --sel:#f1dda6;
    --serif:'Cinzel',serif; --sans:'Manrope','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font:13px/1.5 var(--sans)}
  #app{position:fixed;inset:0}
  canvas{display:block}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.5) 100%)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(212,175,106,.25);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  .label{color:#dde6f8;font:400 11px var(--sans);letter-spacing:.4px;
    text-shadow:0 0 5px #000,0 0 10px #000;white-space:nowrap;pointer-events:auto;cursor:pointer}
  .label:hover{color:#fff}
  .label.major{font-size:12px;font-weight:600;letter-spacing:.7px}
  .label.dim{color:#8fa0c0;font-size:10px}
  .label.static{pointer-events:none;cursor:default}
  .label.selected{color:var(--sel)}
  .label.star{color:#cfd9ee;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.85}
  .label.const{font-family:var(--serif);font-size:11.5px;font-weight:600;letter-spacing:3px;
    color:#aeb9d6;text-transform:uppercase;opacity:.9}
  .label.const:hover{color:var(--gold-2)}
  .label.zod{font-family:var(--serif);font-size:12.5px;font-weight:700;letter-spacing:3.5px;
    color:var(--gold);text-transform:uppercase;text-shadow:0 0 6px #000,0 0 14px rgba(212,175,106,.5)}
  .label.zod:hover{color:var(--gold-2)}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
    padding:10px 16px;background:linear-gradient(180deg,rgba(2,4,10,.95) 30%,rgba(2,4,10,0));
    z-index:20;flex-wrap:wrap}
  #topbar .title{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:3px;
    margin-right:14px;background:linear-gradient(180deg,#f6e7b8,#c29c52);
    -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
  #topbar .title small{display:block;color:var(--dim);-webkit-text-fill-color:var(--dim);
    font-family:var(--sans);font-weight:400;font-size:9.5px;letter-spacing:2px;text-transform:uppercase}
  .modebtn{background:rgba(10,14,24,.7);border:1px solid var(--gold-dim);color:var(--txt);
    padding:7px 15px;border-radius:999px;cursor:pointer;font:600 12px var(--sans);
    letter-spacing:.6px;transition:.2s}
  .modebtn:hover{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,106,.25);color:#fff}
  .modebtn.active{background:linear-gradient(165deg,rgba(212,175,106,.22),rgba(212,175,106,.08));
    border-color:var(--gold);color:var(--gold-2);box-shadow:0 0 18px rgba(212,175,106,.3)}

  #clock{margin-left:auto;text-align:center;font-variant-numeric:tabular-nums;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:7px 20px 6px;box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(241,221,166,.14)}
  #clock .rt{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:2.5px;
    color:var(--gold-2);text-shadow:0 0 12px rgba(212,175,106,.35)}
  #clock .st{font-size:10px;color:var(--dim);letter-spacing:1.8px;text-transform:uppercase;margin-top:2px}

  .panel{position:fixed;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:14px 16px;z-index:15;backdrop-filter:blur(14px);
    box-shadow:0 14px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(241,221,166,.12)}
  #ctl{left:14px;bottom:14px;width:336px;max-height:58vh;overflow:auto}
  #info{right:14px;top:74px;width:336px;max-height:58vh;overflow:auto;font-size:12px}
  #info h3{font-family:var(--serif);font-size:12.5px;letter-spacing:1.6px;color:var(--gold);
    margin:10px 0 5px;text-transform:uppercase}
  #info h3:first-child{margin-top:0}
  #info table{width:100%;border-collapse:collapse;margin:2px 0 6px}
  #info td{padding:2px 4px;border-bottom:1px solid rgba(212,175,106,.1);vertical-align:top}
  #info td:last-child{text-align:right;color:#fff;white-space:nowrap}
  #info .note{color:var(--dim);font-size:11px;margin:5px 0}

  #selCard{right:14px;bottom:14px;width:336px;display:none;z-index:18}
  #selCard h3{font-family:var(--serif);color:var(--gold-2);font-size:14.5px;letter-spacing:1.5px;margin-bottom:6px}
  #selCard table{width:100%;border-collapse:collapse;margin-bottom:9px;font-size:12px}
  #selCard td{padding:2px 4px;border-bottom:1px solid rgba(212,175,106,.1)}
  #selCard td:last-child{text-align:right;color:#fff;white-space:nowrap}
  #selCard .desc{color:var(--dim);font-size:11px;margin-bottom:9px}
  #selCard .btns{display:flex;gap:8px;flex-wrap:wrap}

  .ctlrow{display:flex;align-items:center;gap:8px;margin:7px 0}
  .ctlrow label{flex:0 0 128px;color:var(--dim);font-size:11.5px;letter-spacing:.3px}
  .ctlrow input[type=range]{flex:1;accent-color:var(--gold);height:3px}
  .ctlrow .val{flex:0 0 88px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--gold-2)}
  .ctlrow input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}
  .sect{border-top:1px solid rgba(212,175,106,.14);margin-top:10px;padding-top:10px}
  .sect:first-child{border:0;margin-top:0;padding-top:0}
  .sect>b{display:block;font-family:var(--serif);color:var(--gold);font-size:11px;
    letter-spacing:1.8px;text-transform:uppercase;margin-bottom:4px;font-weight:600}
  .btn{background:rgba(10,14,24,.75);border:1px solid var(--gold-dim);color:var(--txt);
    padding:5px 13px;border-radius:8px;cursor:pointer;font:600 12px var(--sans);transition:.2s}
  .btn:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(212,175,106,.25);color:#fff}
  .btn.green{border-color:rgba(241,221,166,.55);color:var(--sel)}
  .btn.warn{border-color:rgba(232,184,106,.55);color:var(--warn)}
  select{background:rgba(10,14,24,.95);border:1px solid var(--gold-dim);color:var(--txt);
    border-radius:8px;padding:6px 9px;font:400 12px var(--sans);max-width:100%}

  #hud{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;text-align:center;
    z-index:14;font-variant-numeric:tabular-nums;pointer-events:none;max-width:72vw}
  #hud .big{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:1.6px;
    color:var(--gold-2);text-shadow:0 0 8px #000,0 0 18px rgba(212,175,106,.3)}
  #hud .sub{font-size:11px;color:var(--dim);letter-spacing:.8px;text-shadow:0 0 6px #000;margin-top:2px}
  #togglePanels{position:fixed;right:14px;top:12px;z-index:25}
  details summary{cursor:pointer;color:var(--gold);font-size:11.5px;letter-spacing:.6px;margin:7px 0 3px}
  #landedBanner{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:18;
    display:none;background:var(--panel);border:1px solid rgba(241,221,166,.4);
    border-radius:12px;padding:9px 18px;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(241,221,166,.15)}
  #landedBanner b{font-family:var(--serif);color:var(--sel);letter-spacing:1.5px}
  #landedBanner .small{color:var(--dim);font-size:11px}

  /* ---------- mode row, chips, cycle bars, day theme ---------- */
  #modeRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #themeBtn{border-radius:999px;padding:7px 12px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
  .chip{background:rgba(10,14,24,.75);border:1px solid var(--gold-dim);color:var(--txt);
    padding:3px 9px;border-radius:999px;cursor:pointer;font:600 10.5px var(--sans);transition:.15s}
  .chip:hover{border-color:var(--gold);color:var(--gold-2)}
  .cycrow{display:flex;align-items:center;gap:7px;margin:6px 0;font-size:11.5px}
  .cycrow .nm{flex:1;color:var(--txt)}
  .cycrow .pd{color:var(--dim);white-space:nowrap;font-size:10.5px}
  .cycbar{flex:0 0 64px;height:5px;border-radius:3px;background:rgba(212,175,106,.15);overflow:hidden}
  .cycbar i{display:block;height:100%;background:linear-gradient(90deg,#c9a55a,#f1dda6)}
  .evrow{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:11.5px}
  .evrow .ed{color:var(--gold-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .evrow .et{flex:1;color:var(--dim)}
  input[type=datetime-local],input[type=date]{background:rgba(10,14,24,.95);
    border:1px solid var(--gold-dim);color:var(--txt);border-radius:8px;padding:5px 8px;
    font:400 12px var(--sans);color-scheme:dark}
  .radioRow{display:flex;gap:4px;margin:4px 0}
  .radioRow .btn.on{border-color:var(--gold);color:var(--gold-2);
    background:linear-gradient(165deg,rgba(212,175,106,.2),rgba(212,175,106,.06))}

  body.day{
    --bg:#ece5d3;
    --gold:#8a6d2f; --gold-2:#6d5320; --gold-dim:rgba(138,109,47,.45);
    --panel:linear-gradient(165deg, rgba(250,246,235,.95), rgba(238,231,212,.92));
    --border:rgba(138,109,47,.4);
    --txt:#33301f; --dim:#6e6650; --warn:#9a6b16; --sel:#6d5320;
  }
  body.day #topbar{background:linear-gradient(180deg,rgba(236,229,211,.95) 30%,rgba(236,229,211,0))}
  body.day #topbar .title{background:linear-gradient(180deg,#7a5f24,#4a3a12);
    -webkit-background-clip:text;background-clip:text}
  body.day #topbar .title small{-webkit-text-fill-color:#6e6650}
  body.day .modebtn{background:rgba(250,246,235,.8)}
  body.day .btn,body.day .chip{background:rgba(250,246,235,.85)}
  body.day select,body.day input[type=datetime-local]{background:rgba(250,246,235,.95);color:#33301f;color-scheme:light}
  body.day #clock .rt{text-shadow:none}
  body.day::after{background:radial-gradient(ellipse at center, transparent 60%, rgba(60,45,15,.18) 100%)}

  #mBtns{display:none;position:fixed;left:10px;bottom:10px;z-index:26;gap:8px}
  #mBtns .btn{padding:10px 15px;font-size:13px;border-radius:12px}
  @media (max-width:760px){
    #topbar{padding:6px 8px;gap:5px}
    #topbar .title{font-size:13px;letter-spacing:2px;flex-basis:100%;text-align:center;margin:0}
    #topbar .title small{font-size:8px;letter-spacing:1.5px}
    #modeRow{flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
    #modeRow::-webkit-scrollbar{display:none}
    .modebtn{padding:8px 10px;font-size:10.5px;flex:0 0 auto;white-space:nowrap;letter-spacing:.2px}
    #themeBtn{position:fixed;right:8px;top:8px;z-index:30;padding:6px 10px}
    #clock{margin:2px auto 0;flex-basis:100%;display:flex;justify-content:center;
      align-items:baseline;gap:14px;padding:4px 12px}
    #clock .rt{font-size:13.5px;letter-spacing:1.5px}
    #clock .st{font-size:9.5px;margin-top:0}
    #togglePanels{display:none}
    #mBtns{display:flex}
    #ctl,#info{left:10px;right:10px;width:auto;max-height:44vh;bottom:60px;top:auto;display:none}
    #selCard{left:10px;right:10px;width:auto;bottom:60px;max-height:46vh;overflow:auto}
    #hud{bottom:62px;max-width:94vw}
    #hud .big{font-size:12.5px;letter-spacing:1px}#hud .sub{font-size:9.5px}
    #landedBanner{top:auto;bottom:108px;width:92vw}
    .label{font-size:11.5px}.label.major{font-size:12.5px}
    .label.const{font-size:10px;letter-spacing:2px}.label.zod{font-size:11px;letter-spacing:2.5px}
    .btn{padding:8px 13px}
    .ctlrow label{flex:0 0 106px;font-size:11px}
  }
</style>
</head>

  <span class="title">S³ LIGHT-TRISPHERE<small>Solar System · Compact S³ Universe · FBS3R φ-Ladder · Celestial Atlas</small></span>

</div>

<script type="module">
import * as THREE from 'three';

import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================================================================
   MODEL CONSTANTS — fiducial benchmark values from the article
   "Conditional Reconstruction of a Quasi-Local Observable Domain
   within Compact S³ Geometry" (v38, light-sphere screens).
   R = (c/H0)/sqrt(|Ωk|), |Ωk| = 0.0007, H0 = 67.4 km/s/Mpc
   ================================================================ */
const S3 = {
  R:          548.324513026856,     // Gly — curvature radius of S³
  Dcausal:    1722.612261908368,    // Gly — intrinsic causal diameter πR
  Circ:       3445.224523816736,    // Gly — full great circle 2πR
  V:          3.254188648717e9,     // Gly³ — proper volume 2π²R³
  tCoh:       1722.612261908368,    // Gyr — full causal accessibility time πR/c
  t0:         13.787718785602,      // Gyr — age of the hot history
  theta0deg:  1.440712710740,       // ° — ct0 arc on a great circle
  Dparticle:  46.125169765204,      // Gly — particle horizon (background-dependent input)
  thetaPdeg:  4.819732647519,       // ° — particle-horizon arc
  chiP:       0.08412,              // rad — D_particle / R
  GammaObs:   1.2613777438877e-4,   // volume fraction of the observable domain
};
const Gamma = chi => (chi - 0.5*Math.sin(2*chi)) / Math.PI;       // exact S³ ball volume fraction
const screenArea = chi => 4*Math.PI*S3.R*S3.R*Math.sin(chi)**2;  // A(χ) = 4πR²sin²χ

/* ================================================================
   FBS3R — "Fractal Bindu (S³) of Reality" (Preece & Batenin, 2025;
   PhilArchive PREFBS / PREFAC-3, figshare 28631525, OSF vdfwh).
   Eternal compact S³ with a FIXED energy budget evolving by nonlocal
   re-quantization of energy density — continuous cyclicity, no
   singular Big Bang. Published relations used here verbatim:
     R(N) = l_P · φ^N            (golden-ratio fractal ladder)
     N(t_rec) = 266              (recombination anchor, t ≈ 380,000 yr)
     ρ ∝ V⁻¹ ∝ φ^(−3N)           (fixed budget over V = 2π²R³)
     E_n quantized via Fibonacci F_n ≈ φ^n/√5
   Cross-model consistency bridge: the Light-Trisphere radius
   R = 548.3 Gly is reached at N = ln(R/l_P)/ln φ ≈ 299.1 levels.
   ================================================================ */
const PHI = (1+Math.sqrt(5))/2;
const LN_PHI = Math.log(PHI), LOG10_PHI = Math.log10(PHI);
const GOLDEN_ANGLE = Math.PI*(3-Math.sqrt(5));
const LY_M = 9.4607304725808e15, GLY_M = LY_M*1e9;
const FBS = {
  lP: 1.616255e-35,                 // m — Planck length (seed radius, N = 0)
  tP: 5.391247e-44,                 // s — Planck time
  Nrec: 266,                        // published anchor: level at recombination

FBS.Nobs = Math.log(S3.Dparticle*GLY_M/FBS.lP)/LN_PHI; // ≈ 293.8 — particle horizon

const levelOf  = L => Math.log(L/FBS.lP)/LN_PHI;        // N(L)
const log10RhoRatio = N => -3*N*LOG10_PHI;              // log10(ρ/ρ_P) = −3N·log10φ
const log10Fib = N => N*LOG10_PHI - 0.5*Math.log10(5);  // Binet: F_N ≈ φ^N/√5
function fmtLen(m){
  if(!isFinite(m)) return '—';
  if(m<1e-12) return (m*1e15).toPrecision(3)+' fm';
  if(m<1e-9)  return (m*1e12).toPrecision(3)+' pm';

  if(m<1)     return (m*1e3).toPrecision(3)+' mm';
  if(m<1e4)   return m.toPrecision(3)+' m';
  if(m<1e10)  return (m/1e3).toPrecision(3)+' km';
  if(m<LY_M*0.1) return (m/1.495978707e11).toPrecision(3)+' AU';
  if(m<LY_M*1e3) return (m/LY_M).toPrecision(3)+' ly';
  if(m<LY_M*1e6) return (m/(LY_M*1e3)).toPrecision(3)+' kly';
  if(m<LY_M*1e9) return (m/(LY_M*1e6)).toPrecision(3)+' Mly';
  return (m/GLY_M).toPrecision(4)+' Gly';
}
const FBS_EPOCHS = [
  {key:'planck', N:0,                       name:'Planck seed — N = 0',          time:'t_P = 5.39×10⁻⁴⁴ s',
   desc:'The seed of the fractal ladder: R(0) = l_P. In FBS3R there is no singular Big Bang — the ladder is a phase of an eternal cyclic S³.'},
  {key:'proton', N:levelOf(8.414e-16),      name:'Proton radius',                time:null,

  {key:'ly',     N:levelOf(LY_M),           name:'One light-year',               time:null,

  {key:'mw',     N:levelOf(4.96e20),        name:'Milky Way scale',              time:null,

  {key:'rec',    N:FBS.Nrec,                name:'Recombination anchor — N = 266', time:'t_rec ≈ 380,000 yr',
   desc:'Published FBS3R anchor: N(t_rec) = 266, so R(266) = l_P·φ²⁶⁶ ≈ 6.3×10²⁰ m. The CMB is released here.'},

function moonGeo(T){
  const d=DEG;
  const Lp=218.3164477+481267.88123421*T;
  const D =297.8501921+445267.1114034*T;
  const M =357.5291092+35999.0502909*T;
  const Mp=134.9633964+477198.8675055*T;
  const F =93.2720950+483202.0175233*T;
  const lon=(Lp
    +6.288774*Math.sin(Mp*d)+1.274027*Math.sin((2*D-Mp)*d)+0.658314*Math.sin(2*D*d)
    +0.213618*Math.sin(2*Mp*d)-0.185116*Math.sin(M*d)-0.114332*Math.sin(2*F*d)
    +0.058793*Math.sin((2*D-2*Mp)*d)+0.057066*Math.sin((2*D-M-Mp)*d)
    +0.053322*Math.sin((2*D+Mp)*d)+0.045758*Math.sin((2*D-M)*d))*d;
  const lat=(5.128122*Math.sin(F*d)+0.280602*Math.sin((Mp+F)*d)+0.277693*Math.sin((Mp-F)*d)
    +0.173237*Math.sin((2*D-F)*d)+0.055413*Math.sin((2*D+F-Mp)*d)+0.046271*Math.sin((2*D-F-Mp)*d))*d;
  const rKM=385000.56-20905.355*Math.cos(Mp*d)-3699.111*Math.cos((2*D-Mp)*d)
    -2955.968*Math.cos(2*D*d)-569.925*Math.cos(2*Mp*d);
  return {lon, lat, rAU:rKM/1.495978707e8};
}

function nearestScaleRef(m){
  let best=SCALE_REFS[0], bd=1e9;
  for(const r of SCALE_REFS){ const d=Math.abs(Math.log10(m/r[0])); if(d<bd){bd=d;best=r;} }
  return bd<0.9 ? '≈ the scale of '+best[1] : (m>best[0]?'beyond ':'below ')+best[1];
}

function focusOn(s){
  const target = s.getPos();
  const dist = s.focusDist ? s.focusDist() : 1;
  const dir = camera.position.clone().sub(controls.target).normalize();
  focusAnim = { t:0, fromT:controls.target.clone(), fromP:camera.position.clone(),
                toT:target.clone(), toP:target.clone().add(dir.multiplyScalar(dist)) };
  followSel = s;
  if(s.onFocus) s.onFocus();
}

const raycaster = new THREE.Raycaster();

renderer.domElement.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downXY || state.landed || state.mode==='fractal') return;
  const dx=e.clientX-downXY[0], dy=e.clientY-downXY[1];
  if(dx*dx+dy*dy>25) return;
  const ndc = new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc, camera);
  const picks=[]; for(const [key,d] of SELECT){ if(d.mode===state.mode && d.pick){ d.pick.userData.selKey=key; picks.push(d.pick);} }
  const hit = raycaster.intersectObjects(picks, false)[0];
  if(hit) selectKey(hit.object.userData.selKey);
});

function starfield(n, radius){
  const g = new THREE.BufferGeometry(); const pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const v = new THREE.Vector3().randomDirection().multiplyScalar(radius*(0.7+0.3*Math.random()));
    pos.set([v.x,v.y,v.z], i*3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  return new THREE.Points(g, new THREE.PointsMaterial({color:0x9db4d8,size:1.2,sizeAttenuation:false,transparent:true,opacity:.7}));
}

const RSKY = 600;
const OBLIQ = 23.4392911*DEG;
function raDecDir(raH, dec){            // J2000 equatorial → scene (ecliptic, Y up)
  const ra = raH*15*DEG, d = dec*DEG;
  const xe = Math.cos(d)*Math.cos(ra), ye = Math.cos(d)*Math.sin(ra), ze = Math.sin(d);
  const yc =  Math.cos(OBLIQ)*ye + Math.sin(OBLIQ)*ze;
  const zc = -Math.sin(OBLIQ)*ye + Math.cos(OBLIQ)*ze;
  return new THREE.Vector3(xe, zc, -yc);
}
function mulberry(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

const skyGroup = new THREE.Group(); solarGroup.add(skyGroup);
skyGroup.add(starfield(3200, 660));

/* --- Milky Way: procedural equirectangular canvas, galactic-plane aligned --- */
const mwMesh = (()=>{
  const W=2048, H=1024;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#000'; x.fillRect(0,0,W,H);
  const rnd=mulberry(987654321);
  const gauss=()=>{ const a=Math.max(rnd(),1e-9), b=rnd();
    return Math.sqrt(-2*Math.log(a))*Math.cos(2*Math.PI*b); };
  // luminous band with the central bulge
  for(let i=0;i<1100;i++){
    const u=rnd()*W;
    const bulge=Math.exp(-((u-W/2)**2)/(2*(W*0.15)**2));
    const sigma=H*0.034*(1+1.7*bulge)+rnd()*H*0.012;
    const v=H/2+gauss()*sigma+Math.sin(u/W*Math.PI*4.2)*7;
    const r=26+rnd()*95*(0.6+bulge);
    const warm=Math.min(1,bulge*0.8+rnd()*0.35);
    const cr=205+warm*50|0, cg=196+warm*26|0, cb=178+(1-warm)*62|0;
    const g=x.createRadialGradient(u,v,0,u,v,r);
    g.addColorStop(0,`rgba(${cr},${cg},${cb},${0.045+0.105*bulge+rnd()*0.035})`);
    g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    x.fillStyle=g; x.beginPath(); x.arc(u,v,r,0,7); x.fill();
  }
  // dark dust lanes threading the plane
  for(let i=0;i<300;i++){
    const u=rnd()*W;
    const bulge=Math.exp(-((u-W/2)**2)/(2*(W*0.2)**2));
    const v=H/2+gauss()*H*0.016+(rnd()-0.5)*9;
    const r=18+rnd()*72;
    const g=x.createRadialGradient(u,v,0,u,v,r);
    g.addColorStop(0,`rgba(6,5,9,${0.14+0.22*bulge*rnd()})`);
    g.addColorStop(1,'rgba(6,5,9,0)');
    x.fillStyle=g; x.beginPath(); x.arc(u,v,r,0,7); x.fill();
  }
  // dense stellar speckle concentrated toward the plane
  for(let i=0;i<10000;i++){
    const u=rnd()*W;
    const conc=1+1.4*Math.exp(-((u-W/2)**2)/(2*(W*0.18)**2));
    const v=H/2+gauss()*H*0.055*conc;
    if(v<0||v>=H) continue;
    x.fillStyle=`rgba(255,${236+rnd()*19|0},${208+rnd()*47|0},${0.12+rnd()*0.5})`;
    x.fillRect(u,v,rnd()<0.93?1:2,rnd()<0.93?1:2);
  }
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(RSKY*1.06, 64, 40),
    new THREE.MeshBasicMaterial({map:tex, side:THREE.BackSide, transparent:true,
      opacity:.85, depthWrite:false})
  );
  // align the local equator with the galactic plane, bulge toward Sgr A*
  const gPole = raDecDir(192.8595/15, 27.1283);
  const gCtr  = raDecDir(266.4050/15, -28.9362);
  const Xg=gCtr.clone().sub(gPole.clone().multiplyScalar(gCtr.dot(gPole))).normalize();
  const Yg=gPole.clone().normalize();
  const Zg=Xg.clone().cross(Yg);
  mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(Xg,Yg,Zg));
  skyGroup.add(mesh);
  return mesh;
})();

function keplerE(M, e){
  let E = e < .8 ? M : Math.PI;
  for(let k=0;k<12;k++){
    const d = (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E));
    E -= d; if(Math.abs(d) < 1e-12) break;
  }
  return E;
}
// heliocentric ecliptic J2000 coordinates in AU; T = Julian centuries since J2000
function planetEcl(p, T){
  const L = (p.L + p.rate*T)*DEG, w = p.w*DEG, O = p.O*DEG, i = p.i*DEG, e = p.e;
  let M = L - w; M = ((M + Math.PI)%(2*Math.PI) + 2*Math.PI)%(2*Math.PI) - Math.PI;
  const E = keplerE(M, e);
  const xp = p.a*(Math.cos(E)-e), yp = p.a*Math.sqrt(1-e*e)*Math.sin(E);
  const wo = w - O, cw=Math.cos(wo), sw=Math.sin(wo), cO=Math.cos(O), sO=Math.sin(O), ci=Math.cos(i), si=Math.sin(i);
  return {
    x:(cw*cO - sw*sO*ci)*xp + (-sw*cO - cw*sO*ci)*yp,
    y:(cw*sO + sw*cO*ci)*xp + (-sw*sO + cw*cO*ci)*yp,
    z:(sw*si)*xp + (cw*si)*yp,
  };
}
function planetPos(p, T){
  const e = planetEcl(p, T);
  return new THREE.Vector3(e.x, e.z, -e.y);  // ecliptic → scene (Y up)
}
const eclToScene = (x,y,z)=>new THREE.Vector3(x, z, -y);
// apparent geocentric solar ecliptic longitude in [0,2π)
function sunEclLon(days){
  const e = planetEcl(PLANETS[2], days/36525);
  let L = Math.atan2(-e.y, -e.x);
  return L<0 ? L+2*Math.PI : L;
}
// next equinoxes & solstices after `fromDays` (bisection on λ_sun = k·90°)
const SEASON_NAMES = ['Vernal equinox ♈','Summer solstice ♋','Autumnal equinox ♎','Winter solstice ♑'];
function nextSeasonEvents(fromDays, count=4){
  const out=[]; let d=fromDays, prev=sunEclLon(d);
  const Q=Math.PI/2;
  while(out.length<count && d<fromDays+400*count){
    const d2=d+5; let cur=sunEclLon(d2);
    let b = cur<prev ? cur+2*Math.PI : cur;
    for(let k=Math.ceil(prev/Q+1e-9); k*Q<=b; k++){
      let lo=d, hi=d2;
      for(let it=0;it<48;it++){
        const mid=(lo+hi)/2;
        let lm=sunEclLon(mid); if(lm<prev-0.5) lm+=2*Math.PI;
        if(lm<k*Q) lo=mid; else hi=mid;
      }
      out.push({days:(lo+hi)/2, name:SEASON_NAMES[((k%4)+4)%4]});
    }
    prev=cur; d=d2;
  }
  return out.slice(0,count);
}
function daysToDateStr(days){
  const ms=(days+2451545.0-2440587.5)*86400000, dt=new Date(ms);
  return isFinite(dt.getTime()) && dt.getUTCFullYear()>=0 && dt.getUTCFullYear()<=9999
    ? dt.toISOString().slice(0,16).replace('T',' ')+' UT' : 'JD '+(days+2451545).toFixed(1);
}

function hopfPoint(theta, phi, t, out){
  const ch=Math.cos(theta/2), sh=Math.sin(theta/2);
  const x1=ch*Math.cos(t+phi), x2=ch*Math.sin(t+phi);
  const x3=sh*Math.cos(t),     x4=sh*Math.sin(t);
  const d=1-x4+1e-9;
  return out.set(x1/d, x2/d, x3/d).multiplyScalar(RU*.55);
}
const hopfBaseDir = (theta,phi)=>new THREE.Vector3(

function buildHopfFibers(density){
  hopfFibersSub.clear();
  hopfDefs = [];
  const RINGS = [[.25,6],[.5,10],[.75,14],[1.05,18],[1.35,14],[1.6,10],[1.85,6]];

/* ----------------------------------------------------------------

   ---------------------------------------------------------------- */
function legendreP(l,m,x){
  let pmm=1;
  if(m>0){ const s=Math.sqrt((1-x)*(1+x)); let f=1;
    for(let i=1;i<=m;i++){ pmm*=-f*s; f+=2; } }
  if(l===m) return pmm;
  let pmmp1=x*(2*m+1)*pmm;
  if(l===m+1) return pmmp1;
  let pll=0;
  for(let ll=m+2;ll<=l;ll++){ pll=((2*ll-1)*x*pmmp1-(ll+m-1)*pmm)/(ll-m); pmm=pmmp1; pmmp1=pll; }
  return pll;
}
function ylmTexture(l,m){
  const W=512,H=256, c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d'), img=ctx.createImageData(W,H);
  const vals=new Float32Array(W*H); let mx=1e-12;
  for(let j=0;j<H;j++){
    const th=(j+0.5)/H*Math.PI, pl=legendreP(l,m,Math.cos(th));
    for(let i=0;i<W;i++){
      const v=pl*Math.cos(m*(i+0.5)/W*2*Math.PI);
      vals[j*W+i]=v; if(Math.abs(v)>mx) mx=Math.abs(v);
    }
  }
  const pos=[212,175,106], neg=[90,140,220], mid=[10,14,24];
  for(let k=0;k<W*H;k++){
    const v=vals[k]/mx, a=Math.abs(v);
    const c1=v>0?pos:neg;
    img.data[k*4  ]=mid[0]+(c1[0]-mid[0])*a;
    img.data[k*4+1]=mid[1]+(c1[1]-mid[1])*a;
    img.data[k*4+2]=mid[2]+(c1[2]-mid[2])*a;
    img.data[k*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

    state.fbsDepth += state.fbsDir*state.fbsCycleSpeed*dt;
    if(state.fbsDepth>=FBS.Ns3){ state.fbsDepth=FBS.Ns3; state.fbsDir=-1; }
    if(state.fbsDepth<=0){ state.fbsDepth=0; state.fbsDir=1; }
  } else if(state.fbsTarget!==null){
    const diff = state.fbsTarget - state.fbsDepth;
    const rate = Math.max(6, Math.abs(diff)*1.8);
    state.fbsDepth += Math.sign(diff)*Math.min(Math.abs(diff), rate*dt);
    if(Math.abs(state.fbsTarget-state.fbsDepth)<0.01){ state.fbsDepth=state.fbsTarget; state.fbsTarget=null; }
  }
  const D = state.fbsDepth;
  const base = Math.floor(D);

  // nested shells: scene radius of level n is φ^(n−D) — an endless zoom ladder
  fbsShells.forEach((sh, idx)=>{
    const n = base - 6 + idx;
    const rs = Math.exp((n-D)*LN_PHI);
    const ok = n>=0 && n<=FBS.Nmax && rs>0.05 && rs<420;
    sh.visible = ok;
    if(!ok) return;
    sh.scale.setScalar(rs);
    const lr = Math.log10(rs);
    sh.material.opacity = .42*Math.max(0, 1-Math.abs(lr-0.4)/2.2);
    sh.material.color.setHSL((n*0.118)%1, .55, .55);
    if(sh.userData.n!==n){
      sh.userData.n = n;
      sh.userData.label.element.textContent = `N=${n} · R=${fmtLen(levelR(n))}`;
    }
    sh.userData.label.visible = rs>0.7 && rs<70;
  });

  // epoch markers ride their shells
  for(const eo of fbsEpochObjs){
    const rs = Math.exp((eo.ep.N-D)*LN_PHI);
    eo.mesh.visible = rs>0.05 && rs<400;
    if(eo.mesh.visible){
      eo.mesh.position.copy(eo.dir).multiplyScalar(rs);
      eo.mesh.scale.setScalar(THREE.MathUtils.clamp(rs*0.028, 0.05, 5));
    }
  }

  // golden spiral: r = φ^(x−D), winding by the golden angle per level
  {
    const pts = [];
    for(let x=Math.max(0,D-5.5); x<=Math.min(FBS.Nmax,D+11); x+=0.08){
      const r = Math.exp((x-D)*LN_PHI), a = x*GOLDEN_ANGLE;
      pts.push(new THREE.Vector3(r*Math.cos(a), 0, r*Math.sin(a)));
    }
    if(pts.length>1) fbsSpiral.geometry.setFromPoints(pts);
    fbsSpiralDot.position.set(Math.cos(D*GOLDEN_ANGLE), 0, Math.sin(D*GOLDEN_ANGLE));
  }

  // nonlocal re-quantization wave
  state.fbsPulse = (state.fbsPulse + dt/7)%1;
  fbsPulse.scale.setScalar(0.06*Math.pow(7000, state.fbsPulse));
  fbsPulse.material.opacity = .3*(1-state.fbsPulse);

  // HUD + live slider sync
  const Rm = levelR(D);
  const phase = D<=FBS.Nrec ? 'fractal φ-phase' : 'exponential H-phase';
  hudBig.textContent = `N = ${D.toFixed(2)} · R = l_P·φᴺ = ${fmtLen(Rm)} · ${nearestScaleRef(Rm)}`;
  hudSub.textContent =
    `${phase} · ρ/ρ_P = 10^${log10RhoRatio(D).toFixed(1)} · F_N ≈ 10^${log10Fib(D).toFixed(1)} · ` +
    (state.fbsCycle ? (state.fbsDir>0?'cycle: expansion ↗':'cycle: re-quantization ↘')
                    : 'scroll / pinch / chips to travel');
  const sl = ctl.querySelector('#fbsN');
  if(sl && document.activeElement!==sl){
    sl.value = D;
    const v = ctl.querySelector('#fbsNV'); if(v) v.textContent = 'N = '+D.toFixed(1);
  }
}

/* ================================================================
   MODE 5 · FRACTAL EXPLORER — Mandelbulb distance-estimator
   raymarcher (self-similar structure across scales)
   ================================================================ */
const fractalUniforms = {
  uRes:    {value:new THREE.Vector2(innerWidth*renderer.getPixelRatio(), innerHeight*renderer.getPixelRatio())},
  uCamPos: {value:new THREE.Vector3()},
  uCamFwd: {value:new THREE.Vector3()},
  uCamRight:{value:new THREE.Vector3()},
  uCamUp:  {value:new THREE.Vector3()},
  uTanFov: {value:Math.tan(27.5*DEG)},
  uPower:  {value:8.0},
  uIters:  {value:12},
  uHue:    {value:0.62},
};
const fractalScene = new THREE.Scene();
{
  const mat = new THREE.ShaderMaterial({
    uniforms: fractalUniforms,
    vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      precision highp float;
      uniform vec2 uRes; uniform vec3 uCamPos,uCamFwd,uCamRight,uCamUp;
      uniform float uTanFov,uPower,uHue; uniform int uIters;
      const int MARCH = 140;

      float mandelbulbDE(vec3 pos, out float trap){
        vec3 z = pos; float dr = 1.0, r = 0.0;
        trap = 1e9;
        for(int i=0;i<20;i++){
          if(i>=uIters) break;
          r = length(z);
          trap = min(trap, r);
          if(r>2.0) break;
          float theta = acos(clamp(z.z/r,-1.0,1.0));
          float phi = atan(z.y, z.x);
          dr = pow(r, uPower-1.0)*uPower*dr + 1.0;
          float zr = pow(r, uPower);
          theta *= uPower; phi *= uPower;
          z = zr*vec3(sin(theta)*cos(phi), sin(phi)*sin(theta), cos(theta)) + pos;
        }
        return 0.5*log(r)*r/dr;
      }
      vec3 hsl2rgb(vec3 c){
        vec3 rgb = clamp(abs(mod(c.x*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0, 0.0, 1.0);
        return c.z + c.y*(rgb-0.5)*(1.0-abs(2.0*c.z-1.0));
      }
      void main(){
        vec2 uv = (gl_FragCoord.xy/uRes - 0.5)*2.0;
        float aspect = uRes.x/uRes.y;
        vec3 rd = normalize(uCamFwd + uv.x*aspect*uTanFov*uCamRight + uv.y*uTanFov*uCamUp);
        vec3 ro = uCamPos;
        float t = 0.0, trap = 0.0, d;
        int steps = 0; bool hit = false;
        for(int i=0;i<MARCH;i++){
          vec3 p = ro + rd*t;
          d = mandelbulbDE(p, trap);
          if(d < 0.0008*t){ hit = true; break; }
          t += d; steps = i;
          if(t > 12.0) break;
        }
        vec3 col;
        if(hit){
          vec3 p = ro + rd*t;
          float h = 0.0012*t; float tr2;
          vec3 n = normalize(vec3(
            mandelbulbDE(p+vec3(h,0,0),tr2)-mandelbulbDE(p-vec3(h,0,0),tr2),
            mandelbulbDE(p+vec3(0,h,0),tr2)-mandelbulbDE(p-vec3(0,h,0),tr2),
            mandelbulbDE(p+vec3(0,0,h),tr2)-mandelbulbDE(p-vec3(0,0,h),tr2)));
          vec3 ldir = normalize(vec3(0.7,0.9,0.4));
          float dif = clamp(dot(n,ldir),0.0,1.0);
          float ao = 1.0 - float(steps)/float(MARCH);
          float hue = fract(uHue + trap*0.45);
          vec3 base = hsl2rgb(vec3(hue, 0.65, 0.32+0.35*ao));
          col = base*(0.25 + 0.85*dif)*ao*1.5;
          col += vec3(0.9,0.95,1.0)*pow(clamp(dot(reflect(-ldir,n),-rd),0.0,1.0),24.0)*0.5;
        } else {
          float g = pow(max(0.0,1.0-length(uv)*0.55), 2.0);
          col = mix(vec3(0.012,0.02,0.045), vec3(0.05,0.09,0.16), g);
          float st = fract(sin(dot(floor(gl_FragCoord.xy/1.5), vec2(12.9898,78.233)))*43758.5453);
          if(st>0.9985) col += vec3(0.8);
        }
        gl_FragColor = vec4(pow(col, vec3(0.92)), 1.0);
      }`,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat);
  quad.frustumCulled = false;
  fractalScene.add(quad);
}

function simDateString(){
  const ms = (state.epochDays + 2451545.0 - 2440587.5)*86400000;
  const d = new Date(ms);
  if(isFinite(d.getTime())){
    const y = d.getUTCFullYear();
    if(y>=0 && y<=9999) return d.toISOString().slice(0,16).replace('T',' ')+' UTC';
  }
  const y = 2000 + state.epochDays/365.2425, ay = Math.abs(y);
  const s = ay>=1e9 ? (ay/1e9).toFixed(3)+' Gyr'
          : ay>=1e6 ? (ay/1e6).toFixed(3)+' Myr'
          : Math.round(ay).toLocaleString('en-US');
  return (y<0?'Year −':'Year ')+s;
}

/* ---------------- LANDING (first-person surface view) ---------------- */
const landedBanner = document.getElementById('landedBanner');
function bodyEntry(key){           // key = planet index or 'moon'
  if(key==='moon') return { name:'Moon', mesh:moonMesh,
    visualR:()=>MOON.r/KM_PER_AU*(state.trueScale?1:state.planetScale) };
  const o = planetObjs[key];
  return { name:o.p.name, mesh:o.mesh,
    visualR:()=>o.p.r/KM_PER_AU*(state.trueScale?1:state.planetScale) };
}
function landOn(idx){
  if(state.mode!=='solar') return;
  const pPos = bodyEntry(idx).mesh.position;
  const dir = camera.position.clone().sub(pPos).normalize();
  if(dir.lengthSq()<1e-9) dir.set(0,1,0);
  state.landed = {
    idx, dir, yaw:0, pitch:.12,
    prevTrue: state.trueScale,
    prevCam: camera.position.clone(), prevTgt: controls.target.clone(), prevFov: camera.fov,
  };
  state.trueScale = true;                  // real angular sizes in the sky
  controls.enabled = false;
  state.fovLand = 60;
  selectKey(null); clearFocus();
  landedBanner.style.display='block';
  document.getElementById('landedName').textContent = 'Landed on '+bodyEntry(idx).name;
  buildCtl();
}
function leaveSurface(){
  if(!state.landed) return;
  state.trueScale = state.landed.prevTrue;
  camera.position.copy(state.landed.prevCam);
  controls.target.copy(state.landed.prevTgt);
  camera.fov = state.landed.prevFov; camera.updateProjectionMatrix();
  camera.up.set(0,1,0);
  state.landed = null;
  controls.enabled = true;
  landedBanner.style.display='none';
  buildCtl();
}
document.getElementById('leaveBtn').onclick = leaveSurface;
addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(state.landed) leaveSurface(); else selectKey(null); }
});
// look-around drag while landed
let lookDrag = null;
renderer.domElement.addEventListener('pointerdown', e=>{ if(state.landed) lookDrag=[e.clientX,e.clientY]; });
addEventListener('pointermove', e=>{
  if(!state.landed || !lookDrag) return;
  if(e.pointerType==='touch' && touchPts.size>=2) return;  // pinch owns the gesture
  const L = state.landed;
  L.yaw   -= (e.clientX-lookDrag[0])*0.0032*(state.fovLand/60);
  L.pitch += (e.clientY-lookDrag[1])*0.0032*(state.fovLand/60);
  L.pitch = Math.max(-1.45, Math.min(1.5, L.pitch));
  lookDrag = [e.clientX,e.clientY];
});
addEventListener('pointerup', ()=>lookDrag=null);
renderer.domElement.addEventListener('wheel', e=>{
  if(state.landed){
    e.preventDefault();
    state.fovLand = Math.max(5, Math.min(95, state.fovLand + Math.sign(e.deltaY)*4));
  } else if(state.mode==='fbs'){
    e.preventDefault();                          // wheel travels the φ-ladder
    state.fbsTarget = null; state.fbsCycle = false;
    state.fbsDepth = THREE.MathUtils.clamp(state.fbsDepth + e.deltaY*0.004, 0, FBS.Nmax);
  }
}, {passive:false});

/* two-finger pinch: FOV when landed, φ-ladder depth in FBS3R mode */
const touchPts = new Map();
renderer.domElement.addEventListener('pointerdown', e=>{
  if(e.pointerType==='touch') touchPts.set(e.pointerId,[e.clientX,e.clientY]);
});
addEventListener('pointermove', e=>{
  if(e.pointerType!=='touch' || !touchPts.has(e.pointerId)) return;
  if(touchPts.size===2){
    const ids=[...touchPts.keys()];
    const a=touchPts.get(ids[0]), b=touchPts.get(ids[1]);
    const oldD=Math.hypot(a[0]-b[0],a[1]-b[1]);
    touchPts.set(e.pointerId,[e.clientX,e.clientY]);
    const a2=touchPts.get(ids[0]), b2=touchPts.get(ids[1]);
    const dd=Math.hypot(a2[0]-b2[0],a2[1]-b2[1])-oldD;
    if(state.landed){
      state.fovLand=THREE.MathUtils.clamp(state.fovLand-dd*0.15,5,95);
    } else if(state.mode==='fbs'){
      state.fbsTarget=null; state.fbsCycle=false;
      state.fbsDepth=THREE.MathUtils.clamp(state.fbsDepth-dd*0.02,0,FBS.Nmax);
    }
  } else touchPts.set(e.pointerId,[e.clientX,e.clientY]);
});
addEventListener('pointerup', e=>touchPts.delete(e.pointerId));
addEventListener('pointercancel', e=>touchPts.delete(e.pointerId));

function updCtlVals(){
  const q = s=>ctl.querySelector(s);
  if(state.mode==='solar'){
    if(q('#spdV')) q('#spdV').textContent = state.daysPerSec>=365 ?
      (state.daysPerSec/365.25).toFixed(1)+' yr/s' : state.daysPerSec.toPrecision(3)+' d/s';
    if(q('#pscV')) q('#pscV').textContent = state.trueScale ? '×1 (1:1)' : '×'+Math.round(state.planetScale);
  } else if(state.mode==='s3'){
    if(q('#chiV')) q('#chiV').textContent = state.chi.toFixed(3)+' rad';
    if(q('#gpsV')) q('#gpsV').textContent = state.gyrPerSec.toPrecision(3);
    if(q('#hdenV')) q('#hdenV').textContent = '×'+state.hopfDensity.toFixed(1)+' ('+hopfDefs.length+' fibres)';
    if(q('#hspdV')) q('#hspdV').textContent = state.hopfFlowSpd.toFixed(1);
    if(q('#hAtV')) q('#hAtV').textContent = state.hopfA.t.toFixed(2);
    if(q('#hApV')) q('#hApV').textContent = state.hopfA.p.toFixed(2);
    if(q('#hBtV')) q('#hBtV').textContent = state.hopfB.t.toFixed(2);
    if(q('#hBpV')) q('#hBpV').textContent = state.hopfB.p.toFixed(2);
    if(q('#eigBV')) q('#eigBV').textContent = 'β = '+state.eigBeta;
    if(q('#eigMV')) q('#eigMV').textContent = 'm = '+state.eigM;
    if(q('#eigInfo')){
      const b=state.eigBeta, lam=(b*b-1)/(S3.R*S3.R), k=Math.sqrt(b*b-1)/S3.R;
      q('#eigInfo').innerHTML =
        `λ_β = ${(lam).toExponential(3)} Gly⁻² · k_β = ${k.toExponential(3)} Gly⁻¹<br>`+
        `wavelength 2π/k_β = ${(2*Math.PI/k).toFixed(1)} Gly · degeneracy g_β = β² = ${b*b}<br>`+
        `mode sector shown: ℓ = ${b-1}, m = ${state.eigM}`;
    }
  } else if(state.mode==='cyc'){
    if(q('#cspdV')){ const v=state.cycYrPerSec;
      q('#cspdV').textContent = v>=1e9?(v/1e9).toPrecision(3)+' Gyr/s'
        : v>=1e6?(v/1e6).toPrecision(3)+' Myr/s'
        : v>=1000?(v/1000).toPrecision(3)+' kyr/s' : v.toPrecision(3)+' yr/s'; }
  } else if(state.mode==='fbs'){
    if(q('#fbsNV')) q('#fbsNV').textContent = 'N = '+state.fbsDepth.toFixed(1);
    if(q('#cycSpV')) q('#cycSpV').textContent = state.fbsCycleSpeed+' lvl/s';
  } else if(state.mode==='fractal'){
    if(q('#powV')) q('#powV').textContent = 'n = '+fractalUniforms.uPower.value.toFixed(1);
    if(q('#itrV')) q('#itrV').textContent = fractalUniforms.uIters.value;
    if(q('#hueV')) q('#hueV').textContent = fractalUniforms.uHue.value.toFixed(2);
  }
}

/* ============================== MAIN LOOP ============================== */
let last = performance.now(), cardTimer = 0;
function tick(now){
  const dt = Math.min((now-last)/1000, .1); last = now;

  /* fractal mode renders its own scene */
  if(state.mode==='fractal'){
    controls.update();
    fractalUniforms.uCamPos.value.copy(camera.position);
    camera.getWorldDirection(fractalUniforms.uCamFwd.value);
    fractalUniforms.uCamRight.value.crossVectors(fractalUniforms.uCamFwd.value, camera.up).normalize();
    fractalUniforms.uCamUp.value.crossVectors(fractalUniforms.uCamRight.value, fractalUniforms.uCamFwd.value).normalize();
    fractalUniforms.uTanFov.value = Math.tan(camera.fov*DEG/2);
    hudBig.textContent = `Mandelbulb z → zⁿ + c · n = ${fractalUniforms.uPower.value.toFixed(1)}`;
    hudSub.textContent = 'self-similar detail at every zoom level · drag to orbit · scroll to zoom';
    renderer.render(fractalScene, orthoCam);
    requestAnimationFrame(tick);
    return;
  }

  if(state.mode==='solar'){
    if(!state.paused) state.epochDays += state.daysPerSec*dt;
    const T = state.epochDays/36525;
    const pScale = state.trueScale ? 1 : state.planetScale;
    const sScale = state.trueScale ? 1 : state.sunScale;
    sunMesh.scale.setScalar(SUN.r/KM_PER_AU*sScale);
    sunGlow.scale.setScalar(state.trueScale ? 6 : 4.2);
    for(const o of planetObjs){
      o.mesh.position.copy(planetPos(o.p, T));
      o.mesh.scale.setScalar(o.p.r/KM_PER_AU*pScale);
      // pick sphere: generous, distance-scaled click target
      o.pick.position.copy(o.mesh.position);
      const dCam = o.mesh.position.distanceTo(camera.position);
      o.pick.scale.setScalar(Math.max(o.mesh.scale.x*1.6, dCam*0.012));
    }

    /* the Moon rides Earth's orbit (orbit exaggerated unless true scale) */
    {
      const g = moonGeo(T);
      const exag = state.trueScale ? 1 : Math.max(8, state.planetScale*0.07);
      const earthP = planetObjs[2].mesh.position;
      const off = eclToScene(
        g.rAU*Math.cos(g.lat)*Math.cos(g.lon),
        g.rAU*Math.cos(g.lat)*Math.sin(g.lon),
        g.rAU*Math.sin(g.lat)).multiplyScalar(exag);
      moonMesh.position.copy(earthP).add(off);
      moonMesh.scale.setScalar(MOON.r/KM_PER_AU*pScale);
      moonPick.position.copy(moonMesh.position);
      moonPick.scale.setScalar(Math.max(moonMesh.scale.x*1.6,
        moonMesh.position.distanceTo(camera.position)*0.008));
      // syzygy: New-Moon alignment with the Sun → eclipse geometry line
      const sunDir = earthP.clone().negate().normalize();
      const moonDir = off.clone().normalize();
      moonElong = sunDir.angleTo(moonDir);
      const nearNode = Math.abs(g.lat/DEG) < 1.6;
      syzygyLine.visible = moonElong/DEG < 2.0 && nearNode;
      if(syzygyLine.visible){
        syzygyLine.geometry.setFromPoints([new THREE.Vector3(0,0,0),
          earthP.clone().multiplyScalar(1.25)]);
      }
    }

    if(state.landed){
      const L = state.landed, B = bodyEntry(L.idx);
      const vR = B.visualR();
      const surf = B.mesh.position.clone().add(L.dir.clone().multiplyScalar(vR*1.003));
      // tangent frame at the standing point
      const up = L.dir.clone();
      let east = new THREE.Vector3(0,1,0).cross(up);
      if(east.lengthSq()<1e-8) east.set(1,0,0); else east.normalize();
      const north = up.clone().cross(east).normalize();
      const cp=Math.cos(L.pitch), sp=Math.sin(L.pitch), cy=Math.cos(L.yaw), sy=Math.sin(L.yaw);
      const dir = north.clone().multiplyScalar(cp*cy).add(east.clone().multiplyScalar(cp*sy)).add(up.clone().multiplyScalar(sp));
      camera.position.copy(surf);
      camera.up.copy(up);
      camera.lookAt(surf.clone().add(dir));
      camera.fov = state.fovLand; camera.updateProjectionMatrix();
      // sky facts: real angular diameter of the Sun from here
      const dSun = B.mesh.position.length();
      const sunAng = 2*Math.atan(SUN.r/KM_PER_AU/dSun)/DEG;
      document.getElementById('landedInfo').textContent =
        ` · Sun distance ${dSun.toFixed(2)} AU · Sun angular Ø ${sunAng.toFixed(2)}° · FOV ${state.fovLand}°`;
      hudBig.textContent = `Standing on ${B.name} — ${simDateString()}`;
      hudSub.textContent = 'true-scale sky: every other planet is a real dot of light · Esc to leave';
    } else {
      hudBig.textContent = simDateString();
      hudSub.textContent = 'heliocentric ecliptic J2000 · 1 unit = 1 AU · click any object to select it';
    }
  }
  else if(state.mode==='obs'){
    hudBig.textContent = `Γ_obs = 0.0126 % of the S³ volume · θ_particle = 4.82°`;
    hudSub.textContent = '1 unit = 1 Gly · domain D_obs(p,T) ⊂ S³_R · screens are reconstruction boundaries';
  }
  else if(state.mode==='s3'){
    if(state.s3view==='sec'){
      if(state.photonRun){
        state.photonT += state.gyrPerSec*dt;
        if(state.photonT > S3.Circ) state.photonT -= S3.Circ;
      }
      const a = state.photonT/S3.R;
      photon.position.set(RU*Math.sin(a), RU*Math.cos(a), 0);
      const n = Math.max(2, Math.min(257, Math.floor(a/(2*Math.PI)*256)+2));
      const tp = [];
      for(let k=0;k<n;k++){
        const aa = k/(n-1)*a;
        tp.push(new THREE.Vector3(RU*1.003*Math.sin(aa), RU*1.003*Math.cos(aa), 0));
      }
      photonTrail.geometry.setFromPoints(tp);
      const GT = Gamma(Math.min(a, Math.PI));
      hudBig.textContent = `t = ${state.photonT.toFixed(1)} Gyr · arc ${(a/DEG).toFixed(1)}° · Γ(T) = ${(GT*100).toFixed(2)} % ${a>=Math.PI?'· FULL CAUSAL ACCESSIBILITY (t ≥ t_coh)':''}`;
      hudSub.textContent = '1 unit = 100 Gly · R = 548.32 Gly · t_coh = πR/c = 1722.6 Gyr · ∂S³_R = ∅';
    } else if(state.s3view==='hopf'){
      if(state.hopfFlow){ hopfFlowT += dt*state.hopfFlowSpd; updateHopfBeads(hopfFlowT); }
      hopfGroup.rotation.y += dt*0.03;
      hudBig.textContent = `Hopf flow · ${hopfDefs.length} fibres · every pair linked once`;
      hudSub.textContent = 'beads ride the S¹ action — each fibre slides along itself · gold & white fibres are inseparable';
    } else {
      eigSphere.rotation.y += dt*0.06;
      const b=state.eigBeta;
      hudBig.textContent = `Eigenmode β = ${b} · λ_β = (β²−1)/R² · g_β = ${b*b}`;
      hudSub.textContent = `discrete compact-mode ladder k_β = √(β²−1)/R — the article's replacement for the flat k-continuum`;
    }
  }
  else if(state.mode==='cyc'){
    updateCyc(dt);
  }
  else if(state.mode==='fbs'){
    updateFBS(dt);
  }

  /* focus fly-to animation + follow */
  if(focusAnim){
    focusAnim.t += dt*1.4;
    const k = focusAnim.t>=1 ? 1 : 1-Math.pow(1-focusAnim.t,3);
    controls.target.lerpVectors(focusAnim.fromT, focusAnim.toT, k);
    camera.position.lerpVectors(focusAnim.fromP, focusAnim.toP, k);
    if(focusAnim.t>=1) focusAnim=null;
  } else if(followSel && !state.landed){
    const pos = followSel.getPos();
    const delta = pos.clone().sub(controls.target);
    controls.target.copy(pos);
    camera.position.add(delta);
  }

  /* selection marker + live card refresh */
  const sel = SELECT.get(selectedKey);
  if(sel && sel.mode===state.mode && !state.landed){
    const pos = sel.getPos();
    selMarker.visible = true;
    selMarker.position.copy(pos);
    selMarker.quaternion.copy(camera.quaternion);
    selMarker.scale.setScalar(pos.distanceTo(camera.position)*0.035);
    cardTimer += dt;
    if(cardTimer>0.25){ cardTimer=0; updateSelCard(); }
  } else selMarker.visible = false;

  if(!state.landed) controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
setMode('solar');
requestAnimationFrame(tick);
</script>
</body>
</html>
