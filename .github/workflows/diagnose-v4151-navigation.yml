name: Diagnose v4.151 navigation self-tests

on:
  push:
    branches:
      - agent/first-principles-atlas-4.151
    paths:
      - .github/workflows/diagnose-v4151-navigation.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/first-principles-atlas-4.151
      - name: Print navigation self-test predicates
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for(const needle of [
            'the registries close:',
            'AND CHOOSING A LABORATORY IN THE COMMAND PALETTE ACTUALLY GOES THERE'
          ]){
            const i=s.indexOf(needle);
            console.log('\n=== '+needle+' ===');
            console.log('index',i);
            console.log(i>=0?s.slice(Math.max(0,i-2200),Math.min(s.length,i+2600)):'NOT FOUND');
          }
          NODE
