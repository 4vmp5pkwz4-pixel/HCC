name: Computational core

# Everything that can disagree with something else, checked on every push. The point is not
# that the tests pass — it is that the atlas, the extracted kernels, the generated contracts
# and the running service are all forced to say the same thing, and the build stops if any
# two of them do not.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # the provenance block reads the commit at call time; a shallow clone with no
          # history still has HEAD, but fetch-depth 0 keeps `git rev-parse` honest
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The extracted kernels are in step with index.html
        run: node scripts/extract-kernels.mjs --check

      - name: Regenerate every machine-facing contract from the core
        run: node scripts/build-api.mjs

      - name: The generated contracts are committed, not merely generatable
        # a contract that only exists after a build step is a contract nobody can read
        # in the repository, and a stale one in the repository is worse than none
        run: |
          if ! git diff --quiet -- api/openapi.json .well-known/mcp.json api/open-problems.json; then
            echo "::error::generated contracts differ from what is committed — run scripts/build-api.mjs and commit the result"
            git --no-pager diff --stat -- api/openapi.json .well-known/mcp.json api/open-problems.json
            exit 1
          fi

      - name: Static validator
        run: node scripts/validate.mjs

      - name: Every verifier
        run: |
          fail=0
          for f in docs/verify-*.cjs; do
            printf '· %s … ' "$f"
            if node "$f" > /tmp/out.txt 2>&1; then echo ok; else echo FAILED; tail -30 /tmp/out.txt; fail=1; fi
          done
          exit $fail

      - name: API contract and benchmark suite, with the job bounds squeezed
        # a small HCC_MAX_ACTIVE_JOBS is deliberate: it makes the 429 BUSY path a thing that
        # is exercised on every run rather than a branch nobody has entered since it was written
        env:
          HCC_MAX_ACTIVE_JOBS: 2
          HCC_MAX_RETAINED_RUNS: 32
        run: node test/run-tests.mjs

      - name: Headless agent scenario
        run: node scripts/demo-agent.mjs

      # ── AND THE ATLAS'S OWN EIGHT HUNDRED ASSERTIONS ────────────────────────
      # scripts/ci.mjs runs these, and this workflow does not run scripts/ci.mjs — it
      # hand-enumerates the same steps, which is a duplicated list, and a duplicated list
      # drifts. It had already drifted: the self-test gate existed locally and this file
      # knew nothing about it, so the suite was a gate on one machine and not on the one
      # that decides whether a release ships.
      #
      # This is the only step here that needs a browser. The suite runs from two arrivals
      # — the default one and a deep link into an S³ laboratory — because a world-gated
      # clause is only a check in the world that gates it, and every harness ever pointed
      # at this page arrived in the same one. That blindness had been hiding a failing
      # assertion since the seventy-second laboratory.
      # `playwright install` downloads BROWSERS. It does not put the package in
      # node_modules, so the import in scripts/selftest.mjs found nothing and the step
      # failed with "playwright not available" one line after reporting a successful
      # Chromium download. Both halves are needed: the package to drive it, the browser
      # to be driven.
      - name: Install Chromium and the driver for the browser-side suite
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: The atlas's own self-tests, from every arrival
        run: node scripts/selftest.mjs --list

      - name: The service starts, answers, and needs no browser to do it
        run: |
          node server/server.mjs & pid=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8974/api/v1/health > /tmp/h.json && break
            sleep 0.25
          done
          node -e "
            const h = require('/tmp/h.json');
            if (h.status !== 'ok' || h.requires_webgl !== false) { console.error('health is wrong:', h); process.exit(1); }
            console.log('core ' + h.core_version + ' · ' + h.labs + ' laboratories, ' + h.implemented + ' implemented · ' +
              'jobs on ' + h.jobs.execution + ' · MCP ' + h.mcp.jsonrpc);
          "
          curl -sf -X POST http://127.0.0.1:8974/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const t=JSON.parse(s).result.tools.map(x=>x.name);
                if(t.length!==9){console.error('expected nine MCP tools, got',t);process.exit(1);}
                console.log('MCP tools: '+t.join(', '));})"
          kill $pid

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image, which runs the whole suite inside itself
        run: docker build -t hcc-core:ci .
      - name: And the built image serves
        run: |
          docker run -d --name hcc -p 8974:8974 hcc-core:ci
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8974/api/v1/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8974/api/v1/health | head -c 400
          docker rm -f hcc
