name: Export exact index

on:
  push:
    branches:
      - feat/unified-atlas-time-4.152

permissions:
  contents: read

jobs:
  export-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report exact index identity
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)"
          echo "index_blob=$(git hash-object index.html)"
          test -s index.html
      - name: Upload exact index
        uses: actions/upload-artifact@v4
        with:
          name: exact-index-html
          path: index.html
          if-no-files-found: error
          retention-days: 1
