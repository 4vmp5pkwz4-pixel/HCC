name: Apply v4.150 Chronometry 3D observatory

on:
  push:
    branches:
      - release/4.150.0-ancient-chronometry
    paths:
      - '.github/workflows/apply-v4150-chronometry-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v4150-chronometry-visual
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.150.0-ancient-chronometry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add the deterministic Source Space / Science Space station
        run: |
          node .github/scripts/apply-v4150-chronometry-visual.cjs
          git diff --check
      - name: Prove Chronometry visual contract and Cycles regressions
        run: |
          node docs/verify-chronometry-visual-contract.cjs
          node docs/verify-cycles-mechanism.cjs
          npm test
      - name: Commit only after the station is proven
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(cycles): add Ancient Chronometry observatory'
          git push origin HEAD:release/4.150.0-ancient-chronometry
