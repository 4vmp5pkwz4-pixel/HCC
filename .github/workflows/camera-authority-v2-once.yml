name: Apply camera authority v2 once

on:
  push:
    branches:
      - chatgpt/camera-authority-enforcement

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/camera-authority-enforcement
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the atomic source patch
        run: node scripts/apply-camera-authority-v2.mjs
      - name: Validate camera authority and seam continuity
        run: |
          node docs/verify-camera-limit-authority.cjs
          node docs/verify-scale-continuity.cjs
          node docs/verify-the-seam-lands-at-the-observer.cjs
          node scripts/validate.mjs
      - name: Commit source patch and remove temporary harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/camera-authority-v2-once.yml
          rm scripts/apply-camera-authority-v2.mjs
          git add index.html docs/verify-camera-limit-authority.cjs scripts/run-quick-verifiers.mjs
          git add -u .github/workflows/camera-authority-v2-once.yml scripts/apply-camera-authority-v2.mjs
          git commit -m "Enforce camera authority across paced scale crossings"
          git push origin HEAD:chatgpt/camera-authority-enforcement
