name: Apply v4.150.0 Ancient Chronometry release

on:
  push:
    branches:
      - release/4.150.0-ancient-chronometry
    paths:
      - '.github/workflows/apply-v4150-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v4150-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.150.0-ancient-chronometry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic release patch
        run: node scripts/patch-v4150-chronometry-release-v2.cjs
      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Regenerate extracted and machine-facing contracts
        run: |
          node scripts/extract-kernels.mjs
          node scripts/build-manifest.mjs
          node scripts/build-api.mjs
          node scripts/reach.mjs
      - name: Prove Chronometry Phase A and live integration
        run: |
          node docs/verify-chronometry-source-locked.cjs
          node docs/verify-chronometry-falsification.cjs
          node docs/verify-ancient-astronomy-benchmarks.cjs
          node docs/verify-world-lab-routing.cjs
          node docs/verify-chronometry-atlas-contract.cjs
          node docs/verify-chronometry-visual-contract.cjs
      - name: Preserve Cycles, Solar GPU and release invariants
        run: |
          node docs/verify-cycles-mechanism.cjs
          node docs/verify-solar-gpu-safe-default.cjs
          node docs/verify-solar-webgl-buffer-lifetime.cjs
          npm test
          node scripts/validate.mjs
          git diff --check
      - name: Commit v4.150.0 only after GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json scripts/build-manifest.mjs core/atlas/extracted.mjs api agent.html 2>/dev/null || true
          git diff --cached --quiet && { echo 'No release changes'; exit 1; }
          git commit -m 'release: v4.150.0 Ancient Chronometry Observatory'
          git push origin HEAD:release/4.150.0-ancient-chronometry
