name: Validate atlas

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/camera-authority-strict'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out audited branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/camera-authority-strict
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict camera authority patch
        run: node scripts/patch-camera-authority-v2.mjs
      - name: Restore canonical CI definition before validating
        run: |
          git checkout origin/main -- .github/workflows/validate.yml
          git rm scripts/patch-camera-authority-v2.mjs
      - name: Verify camera, seams, generated source and fast policy
        run: |
          node docs/verify-camera-limit-authority.cjs
          node docs/verify-scale-continuity.cjs
          node docs/verify-the-seam-lands-at-the-observer.cjs
          node docs/verify-a-framing-is-not-a-gesture.cjs
          node scripts/extract-kernels.mjs
          node scripts/extract-kernels.mjs --check
          node scripts/validate.mjs
          npm test
      - name: Commit audited source result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html core/atlas/extracted.mjs docs/verify-camera-limit-authority.cjs .github/workflows/validate.yml scripts/patch-camera-authority-v2.mjs
          git commit -m "Enforce single-authority camera reach writes"
          git push origin HEAD:chatgpt/camera-authority-strict
