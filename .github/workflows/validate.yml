name: Regenerate extracted core once

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'chatgpt/extracted-regenerate-temp' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/extracted-regenerate-temp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate from canonical index
        run: |
          node scripts/extract-kernels.mjs
          git diff --stat -- core/atlas/extracted.mjs
      - name: Commit generated artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/atlas/extracted.mjs
          git commit -m "Regenerate extracted core from canonical index"
          git push origin HEAD:chatgpt/extracted-regenerate-temp
