name: Validate atlas

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # HEAD^ is enough for the change-aware router on both PR merge refs and
          # ordinary pushes, without downloading the repository's full history.
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run lightweight change-aware validation
        run: npm test
