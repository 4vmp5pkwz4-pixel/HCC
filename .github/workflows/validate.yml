name: Validate atlas

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fast path-scoped pull-request gate
        if: github.event_name == 'pull_request'
        env:
          HCC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:pr

      - name: Multiphase Solar control contract
        if: github.event_name == 'push'
        run: node docs/verify-multiphase-solar-control.cjs
      - name: Linked Cycles release contract
        if: github.event_name == 'push'
        run: node docs/verify-linked-cycle-views.cjs
      - name: Full source audit after merge to main
        if: github.event_name == 'push'
        run: npm test
