name: Validate atlas

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The change-aware verifier only needs the current commit and its parent.
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast affected-system gate
        env:
          HCC_CI_WORKERS: 4
        run: npm test
