name: Validate atlas

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-v41511-linked-cycle-views
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: release/4.151.1-linked-cycle-views
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Materialize linked Cycles view
        run: node scripts/patch-v41511-linked-cycles.cjs
      - name: Regenerate machine contracts
        run: |
          node scripts/extract-kernels.mjs
          node scripts/build-manifest.mjs
          node scripts/build-api.mjs
          node scripts/reach.mjs
      - name: Linked Cycles recovery contract
        run: node docs/verify-linked-cycle-views.cjs
      - name: Run scientific and structural validation
        run: npm test
      - name: Live-contract repository verifiers
        run: |
          fail=0
          for f in docs/verify-*.cjs; do
            case "$f" in
              docs/verify-liveness.cjs|docs/verify-liveness-artifact.cjs|docs/verify-sensitivity.cjs|docs/verify-transfers.cjs|docs/verify-first-principles-browser.cjs)
                echo "· $f … skipped here (long-lived measurement/browser artifact; covered by dedicated/current-main gates)"
                continue
                ;;
            esac
            printf '· %s … ' "$f"
            if node "$f" > /tmp/out.txt 2>&1; then echo ok; else echo FAILED; tail -80 /tmp/out.txt; fail=1; fi
          done
          exit $fail
      - name: Generated contracts are internally consistent
        run: |
          node scripts/extract-kernels.mjs --check
          node scripts/build-manifest.mjs --check
          node scripts/reach.mjs --check
          git diff --check
      - name: Atlas self-tests
        run: node scripts/selftest.mjs --list
      - name: Commit verified v4.151.1 release candidate
        if: github.event_name == 'push'
        run: |
          git config user.name "HCC Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json core/atlas/extracted.mjs api .well-known agent.html
          if git diff --cached --quiet; then
            echo "No generated release changes to commit."
            exit 0
          fi
          git commit -m "release: v4.151.1 Linked Cycle Views"
          git push origin HEAD:release/4.151.1-linked-cycle-views
