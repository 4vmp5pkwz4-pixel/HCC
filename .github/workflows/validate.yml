name: Validate atlas

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Multiphase Solar control contract
        run: node docs/verify-multiphase-solar-control.cjs
      - name: Linked Cycles release contract
        run: node docs/verify-linked-cycle-views.cjs
      - name: Run scientific and structural validation
        run: npm test
