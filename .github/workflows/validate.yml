name: Validate atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose linked-cycle integration hooks
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const needles=['Integrated Information','Integrated Complexity','Unified Scaling','Observer Selection','cycSarosInst','function updateCycles','function updateCyc',"frame==='hierarchy'",'cycFrame','epochDays','cycleByKey','setCyc','renderCyc'];
          for(const needle of needles){
            let from=0,seen=0;
            while(seen<3){
              const i=s.indexOf(needle,from); if(i<0) break;
              console.log(`\n===== ${needle} @ ${i} #${seen+1} =====`);
              console.log(s.slice(Math.max(0,i-1200),Math.min(s.length,i+2400)));
              from=i+needle.length; seen++;
            }
            if(!seen) console.log(`\n===== ${needle}: NOT FOUND =====`);
          }
          NODE
      - name: Run scientific and structural validation
        run: npm test
