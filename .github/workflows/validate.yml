name: Validate atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose linked-cycle semantic mapping
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const lines=s.split(/\r?\n/);
          const re=/(information|complexity|scal(?:e|ing)|observer)/i;
          console.log('=== semantic lines near Cycles / registry / selection ===');
          let shown=0;
          for(let i=0;i<lines.length && shown<140;i++){
            if(re.test(lines[i]) && /(cyc|cycle|lab|view|select|observer|scale|complex)/i.test(lines[i])){
              console.log(`${i+1}: ${lines[i].slice(0,900)}`); shown++;
            }
          }
          for(const needle of ['id="ecSel"','const ecSel','ecSel','ecPredict','cycPhaseAtlas','cycResonanceWeb','registerSel(\'cyc','CYCLE_LAB','LAB_REGISTRY']){
            const i=s.indexOf(needle);
            console.log(`\n===== ${needle} @ ${i} =====`);
            if(i>=0) console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+3800)));
          }
          NODE
      - name: Run scientific and structural validation
        run: npm test
