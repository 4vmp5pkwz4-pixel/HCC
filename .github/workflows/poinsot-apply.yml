name: Apply audited Poinsot phase portrait
on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.comment.body == '/apply-poinsot-reduced-phase-family'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/poinsot-reduced-phase-family
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch exact reduced phase portrait and its verifier
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text()
          reps=[
          ("""  // the polhode family: closed loops near I₁ and I₃, giant figure-eights near I₂
          const polGrp=new THREE.Group(); poinGroup.add(polGrp);""",
          """  // Reduced Euler-top phase portrait: exact Jacobi polhodes from the live kernel.
          // Each admissible L² curve is sampled over one computed period; the antipodal
          // component is the same invariant intersection under ω → -ω.
          const polGrp=new THREE.Group(); poinGroup.add(polGrp);
          for(const r of [0.60,0.78,0.94,0.985,1.015,1.06,1.22,1.40]){
            const l2=2*E*I2*r, lo=2*E*I1, hi=2*E*I3;
            if(l2<=lo+1e-9||l2>=hi-1e-9) continue;
            const sol=poinSolve(I1,I2,I3,E,l2), T=4*agmK(sol.k)/Math.max(1e-9,sol.tau), pts=[];
            for(let j=0;j<=320;j++){ const w=poinOmega(sol,T*j/320); pts.push(new THREE.Vector3(w[0]*S,w[1]*S,w[2]*S)); }
            const near=Math.abs(r-1)<0.04;
            const mat=new THREE.LineBasicMaterial({color:near?0xff8a6a:0x78bfff,transparent:true,opacity:near?.38:.16,depthWrite:false});
            polGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
            polGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(p=>p.clone().multiplyScalar(-1))),mat.clone()));
          }"""),
          ("  // the body itself, so the FLIP is visible as a flip",
           "  // Schematic first-order attitude reconstruction; the exact object above is reduced ω-space."),
          ("  body.position.set(0,-2.6,0); body.scale.setScalar(0.62);",
           """  body.position.set(0,-2.6,0); body.scale.setScalar(0.62);
          const bodyStatus=mkLabel(TT('attitude: illustrative integration','ориентация: иллюстративное интегрирование','Orientierung: illustrative Integration'),'label dim');
          bodyStatus.position.set(0,-3.25,0); poinGroup.add(bodyStatus);"""),
          ("POINSOT · DZHANIBEKOV — ω lives on the intersection of two ellipsoids",
           "EULER TOP · DZHANIBEKOV — exact reduced ω-space"),
          ("ПУАНСО · ДЖАНИБЕКОВ — ω живёт на пересечении двух эллипсоидов",
           "ВОЛЧОК ЭЙЛЕРА · ДЖАНИБЕКОВ — точное редуцированное ω-пространство"),
          ("POINSOT · DSHANIBEKOW — ω lebt auf dem Schnitt zweier Ellipsoide",
           "EULER-KREISEL · DSHANIBEKOW — exakter reduzierter ω-Raum"),
          ("  // integrate the body attitude from ω so the tumble is literal",
           "  // Illustrative first-order attitude integration only; not the classical Poinsot rolling construction."),
          ("The motion here is the exact Jacobi-elliptic solution, not an integration, so the two invariants hold to machine precision.",
           "The reduced ω-trajectory here is the exact Jacobi-elliptic solution; the wingnut pose below is only an illustrative first-order attitude integration. The two reduced invariants hold to machine precision."),
          ("Движение здесь — точное решение в эллиптических функциях Якоби, а не интегрирование, поэтому оба инварианта держатся до машинной точности.",
           "Редуцированная ω-траектория здесь — точное решение в эллиптических функциях Якоби; ориентация гайки ниже — лишь иллюстративное интегрирование первого порядка. Два редуцированных инварианта держатся до машинной точности."),
          ("Die Bewegung ist die exakte Jacobi-Lösung, keine Integration.",
           "Die reduzierte ω-Bahn ist die exakte Jacobi-Lösung; die Körperorientierung darunter ist nur eine illustrative Integration erster Ordnung.")
          ]
          for old,new in reps:
              if s.count(old)!=1:
                  raise SystemExit(f"Poinsot anchor count {s.count(old)} for: {old[:80]}")
              s=s.replace(old,new,1)
          p.write_text(s)

          verifier=r'''#!/usr/bin/env node
          const fs=require('node:fs');
          const path=require('node:path');
          const {pathToFileURL}=require('node:url');
          (async()=>{
            const X=await import(pathToFileURL(path.join(__dirname,'..','core/atlas/extracted.mjs')).href);
            const src=fs.readFileSync(path.join(__dirname,'..','index.html'),'utf8');
            const out=[]; const ok=(n,c,d='')=>out.push([c?'PASS':'FAIL',n,d]);
            const I1=1,I2=2,I3=3,E=1,ratios=[0.60,0.78,0.94,0.985,1.015,1.06,1.22,1.40];
            const K=k=>{let a=1,b=Math.sqrt(Math.max(0,1-k*k));for(let i=0;i<60;i++){const a1=(a+b)/2,b1=Math.sqrt(a*b);a=a1;b=b1;if(Math.abs(a-b)<1e-17)break;}return Math.PI/(2*a);};
            let below=0,above=0,near=0,worstE=0,worstL=0,worstClosure=0;
            for(const ratio of ratios){
              const L2=2*E*I2*ratio,lo=2*E*I1,hi=2*E*I3;
              if(!(L2>lo&&L2<hi)) continue;
              ratio<1?below++:above++; if(Math.abs(ratio-1)<0.04) near++;
              const P=X.poinSolve(I1,I2,I3,E,L2),T=4*K(P.k)/Math.max(1e-12,P.tau);
              let first=null,last=null;
              for(let j=0;j<=320;j++){
                const w=X.poinOmega(P,T*j/320); if(!first)first=w; last=w;
                worstE=Math.max(worstE,Math.abs(I1*w[0]**2+I2*w[1]**2+I3*w[2]**2-2*E));
                worstL=Math.max(worstL,Math.abs(I1**2*w[0]**2+I2**2*w[1]**2+I3**2*w[2]**2-L2));
              }
              worstClosure=Math.max(worstClosure,Math.hypot(first[0]-last[0],first[1]-last[1],first[2]-last[2]));
            }
            ok('rendered phase family spans both sides of the intermediate-axis separatrix',below>0&&above>0);
            ok('rendered phase family includes two near-separatrix trajectories',near>=2);
            ok('every rendered-family sample stays on the exact energy quadric',worstE<1e-10,`worst ${worstE}`);
            ok('every rendered-family sample stays on the exact momentum quadric',worstL<1e-10,`worst ${worstL}`);
            ok('one computed Jacobi period closes every rendered-family curve',worstClosure<1e-8,`worst ${worstClosure}`);
            ok('renderer samples the family from poinSolve/poinOmega rather than a second dynamics kernel',
              src.includes('const sol=poinSolve(I1,I2,I3,E,l2)')&&src.includes('const w=poinOmega(sol,T*j/320)'));
            ok('body-frame scene no longer claims to be the complete classical Poinsot construction',
              src.includes('EULER TOP · DZHANIBEKOV — exact reduced ω-space')&&!src.includes('POINSOT · DZHANIBEKOV — ω lives on the intersection of two ellipsoids'));
            ok('first-order attitude is visibly labelled illustrative',
              src.includes("attitude: illustrative integration")&&src.includes('Illustrative first-order attitude integration only; not the classical Poinsot rolling construction.'));
            for(const [s,n,d] of out) console.log(`${s} — ${n}${d?' · '+d:''}`);
            if(out.some(x=>x[0]==='FAIL')) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1);});
          '''
          # Remove workflow indentation from verifier payload.
          verifier='\n'.join(line[10:] if line.startswith('          ') else line for line in verifier.splitlines())+'\n'
          Path('docs/verify-poinsot-phase-family.cjs').write_text(verifier)

          pkg=Path('package.json').read_text()
          anchor='node docs/verify-the-time-machine.cjs && node docs/verify-the-belt-has-gaps.cjs'
          if pkg.count(anchor)!=1:
              raise SystemExit('package test anchor missing')
          pkg=pkg.replace(anchor,'node docs/verify-the-time-machine.cjs && node docs/verify-poinsot-phase-family.cjs && node docs/verify-the-belt-has-gaps.cjs',1)
          Path('package.json').write_text(pkg)

          ledger='''# Poinsot / Dzhanibekov visualization closure

          Status: ACTIVE IMPLEMENTATION LEDGER

          The reduced Euler-top kernel is exact; the renderer is not yet the full classical Poinsot construction. This ledger keeps that distinction explicit while closure proceeds in independently testable increments.

          ## Closed in this increment
          - The previously empty `polGrp` is populated from the same `poinSolve / poinOmega` Jacobi solution as the live reduced orbit.
          - The family spans both sides of `L² = 2 E I₂` and includes near-separatrix curves.
          - The visible title now says this is exact **reduced ω-space**, not the complete classical rolling construction.
          - The wingnut attitude is explicitly labelled an illustrative first-order integration and is not assigned EXACT status.
          - A permanent verifier checks both quadratic invariants, one-period closure, renderer/kernel coupling, and the epistemic labels.

          ## Still open
          1. Classical Poinsot invariable plane, contact point, rolling ellipsoid and herpolhode.
          2. Reconstruction about fixed spatial angular momentum `L`, with convergence/error verification before any EXACT attitude label.
          3. Explicit local-time provenance or a declared mapping from canonical Atlas time to dimensionless Euler-top time; never identify this with J2000/cosmic time.
          4. Typed/admissible controls for additional inertias or energy only if they preserve `2 E I₁ < L² < 2 E I₃`.
          5. Synchronized multiview from one state authority: reduced ω-space | classical Poinsot | separatrix diagnostic.
          6. Preserve `poin → psr` as structural analogy, not neutron-star dynamics.

          ## Acceptance boundary
          - Reduced dynamics: exact Jacobi kernel, invariants verified numerically to machine-scale tolerance.
          - Attitude: illustrative until reconstruction is upgraded and verified.
          - Classical Poinsot: not claimed until invariable-plane/herpolhode geometry exists.
          '''
          ledger='\n'.join(line[10:] if line.startswith('          ') else line for line in ledger.splitlines())+'\n'
          Path('docs/POINSOT_VISUALIZATION_CLOSURE.md').write_text(ledger)
          PY
      - name: Verify source-of-truth and tests
        run: |
          node scripts/extract-kernels.mjs --check
          npm test
      - name: Commit audited branch change and remove one-shot workflow
        run: |
          rm .github/workflows/poinsot-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html package.json docs/verify-poinsot-phase-family.cjs docs/POINSOT_VISUALIZATION_CLOSURE.md .github/workflows/poinsot-apply.yml
          git commit -m "Render exact reduced Euler-top phase family"
          git push origin HEAD:chatgpt/poinsot-reduced-phase-family
