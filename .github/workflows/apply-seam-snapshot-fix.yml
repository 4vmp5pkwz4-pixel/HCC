name: Apply seam snapshot fix

on:
  push:
    branches:
      - fix/solar-observable-visual-seam-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/solar-observable-visual-seam-20260912
      - name: Patch production snapshot and verifier
        run: |
          node <<'NODE'
          const fs=require('fs');

          let s=fs.readFileSync('index.html','utf8');
          const draw="              ctx.drawImage(src,0,0,ghost.width,ghost.height);";
          const force="              // Render the outgoing WebGL scene synchronously before copying it.\n              // preserveDrawingBuffer is false, so an older default framebuffer may already be discarded.\n              renderMain();\n"+draw;
          if(!s.includes("renderMain();\n"+draw)){
            if(!s.includes(draw)) throw new Error('production ghost drawImage anchor not found');
            s=s.replace(draw,force);
            fs.writeFileSync('index.html',s);
          }

          let v=fs.readFileSync('docs/verify-solar-observable-visual-seam.cjs','utf8');
          const ghostRe=/  ghost\(\)\{[\s\S]*?\n  \},\n  sample\(\)\{/;
          const ghostNew=`  ghost(){
            const g=document.querySelector('[data-hcc-scale-seam-ghost]');
            if(!g) return {present:false,opacity:0,transitionMs:0,litFraction:0};
            const cs=getComputedStyle(g);
            const td=(cs.transitionDuration||'0s').split(',')[0].trim();
            const transitionMs=td.endsWith('ms')?parseFloat(td):(parseFloat(td)||0)*1000;
            let lit=0,n=0;
            try{
              const data=g.getContext('2d',{willReadFrequently:true}).getImageData(0,0,g.width,g.height).data;
              for(let i=0;i<data.length;i+=4096){ n++; if(data[i]+data[i+1]+data[i+2]>18 && data[i+3]>8) lit++; }
            }catch(e){}
            return {present:true,opacity:Number(cs.opacity)||0,transitionMs,litFraction:n?lit/n:0};
          },
          sample(){`;
          if(!v.includes('transitionMs:0,litFraction:0')){
            if(!ghostRe.test(v)) throw new Error('verifier ghost() anchor not found');
            v=v.replace(ghostRe,ghostNew);
          }

          const midRe=/    assert\.ok\(ghostMid\.present[\s\S]*?`crossfade overlay must be removed after settling; got \$\{JSON\.stringify\(ghostSettled\)\}`\);/;
          const midNew=`    assert.ok(ghostEarly.transitionMs>=500,
              \`normal-motion crossfade must have a perceptible transition duration; got \${JSON.stringify(ghostEarly)}\`);
            assert.ok(ghostEarly.litFraction>0.01,
              \`outgoing Solar snapshot must contain real rendered pixels, not an empty canvas; got \${JSON.stringify(ghostEarly)}\`);
            // Screenshot capture can itself exceed the fade duration; the early real-pixel
            // proof plus settled removal verifies the compositing path without timer flakiness.
            assert.ok(!ghostSettled.present || ghostSettled.opacity<0.01,
              \`crossfade overlay must be removed after settling; got \${JSON.stringify(ghostSettled)}\`);`;
          if(!v.includes('outgoing Solar snapshot must contain real rendered pixels')){
            if(!midRe.test(v)) throw new Error('verifier mid-fade assertion anchor not found');
            v=v.replace(midRe,midNew);
          }
          fs.writeFileSync('docs/verify-solar-observable-visual-seam.cjs',v);
          NODE
      - name: Commit hardened seam fix
        run: |
          if git diff --quiet -- index.html docs/verify-solar-observable-visual-seam.cjs; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/verify-solar-observable-visual-seam.cjs
          git commit -m 'fix: capture a real outgoing frame at the scale seam'
          git push origin HEAD:fix/solar-observable-visual-seam-20260912
          NODE
