name: Apply Solar Observable seam crossfade

on:
  push:
    branches:
      - fix/solar-observable-visual-seam-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/solar-observable-visual-seam-20260912
      - name: Patch rendered-frame crossfade into the real scale hand-off
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='index.html';
          let s=fs.readFileSync(file,'utf8');
          const marker='/* HCC_SCALE_SEAM_CROSSFADE_V1 */';
          if(s.includes(marker)){
            console.log('crossfade already present');
            process.exit(0);
          }
          const anchor='function autoSolarScale(dt){';
          if(!s.includes(anchor)) throw new Error('autoSolarScale anchor not found');
          const helper=String.raw`
          /* HCC_SCALE_SEAM_CROSSFADE_V1
             The Solar and Observable instruments use different scene representations.
             Position and scale are mapped exactly at the seam; this transient canvas keeps
             the last rendered outgoing frame above the incoming scene long enough for the
             eye to integrate the two representations instead of seeing a one-frame cut. */
          let _scaleSeamGhost=null, _scaleSeamGhostTimer=0;
          function beginScaleSeamCrossfade(ms=680){
            if(renderer.xr.isPresenting) return;
            const src=renderer.domElement;
            if(!src || !src.width || !src.height) return;
            try{
              if(_scaleSeamGhost){ _scaleSeamGhost.remove(); _scaleSeamGhost=null; }
              if(_scaleSeamGhostTimer){ clearTimeout(_scaleSeamGhostTimer); _scaleSeamGhostTimer=0; }
              const rect=src.getBoundingClientRect();
              if(rect.width<2 || rect.height<2) return;
              const ghost=document.createElement('canvas');
              ghost.width=src.width; ghost.height=src.height;
              ghost.dataset.hccScaleSeamGhost='1';
              ghost.setAttribute('aria-hidden','true');
              const ctx=ghost.getContext('2d',{alpha:true});
              if(!ctx) return;
              ctx.drawImage(src,0,0,ghost.width,ghost.height);
              const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
              const duration=reduced?120:ms;
              Object.assign(ghost.style,{
                position:'fixed',left:rect.left+'px',top:rect.top+'px',
                width:rect.width+'px',height:rect.height+'px',margin:'0',
                pointerEvents:'none',opacity:'1',zIndex:'1',
                transition:'opacity '+duration+'ms cubic-bezier(.22,.61,.36,1)',
                willChange:'opacity',contain:'strict'
              });
              document.body.appendChild(ghost);
              _scaleSeamGhost=ghost;
              const dispose=()=>{
                if(_scaleSeamGhost===ghost) _scaleSeamGhost=null;
                ghost.remove();
              };
              ghost.addEventListener('transitionend',dispose,{once:true});
              requestAnimationFrame(()=>requestAnimationFrame(()=>{
                if(ghost.isConnected) ghost.style.opacity='0';
              }));
              _scaleSeamGhostTimer=setTimeout(dispose,duration+260);
            }catch(err){
              if(_scaleSeamGhost){ _scaleSeamGhost.remove(); _scaleSeamGhost=null; }
            }
          }
          `;
          s=s.replace(anchor,helper+'\n'+anchor);

          const forward="const dir=camera.position.clone().sub(controls.target).normalize();\n    setMode('obs');";
          if(!s.includes(forward)) throw new Error('Solar→Observable hand-off anchor not found');
          s=s.replace(forward,"const dir=camera.position.clone().sub(controls.target).normalize();\n    beginScaleSeamCrossfade();\n    setMode('obs');");

          const reverse="// STRICT continuity: same direction, radius mapped 1:1 (obs Gly → solar AU)\n          setMode('solar'); state.solarScaleLayer='cosmic'; advanceScaleLayer('cosmic');";
          if(!s.includes(reverse)) throw new Error('Observable→Solar hand-off anchor not found');
          s=s.replace(reverse,"// STRICT continuity: same direction, radius mapped 1:1 (obs Gly → solar AU)\n          beginScaleSeamCrossfade();\n          setMode('solar'); state.solarScaleLayer='cosmic'; advanceScaleLayer('cosmic');");

          fs.writeFileSync(file,s);
          console.log('patched Solar↔Observable rendered-frame crossfade');
          NODE
      - name: Commit patched atlas
        run: |
          if git diff --quiet -- index.html; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: visually blend Solar Observable scale seam'
          git push origin HEAD:fix/solar-observable-visual-seam-20260912
