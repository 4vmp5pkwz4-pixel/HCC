name: Visual audit bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  visual:
    if: github.head_ref == 'chatgpt/visual-audit-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser driver and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Render and measure representative Atlas views
        run: npm run test:visual
      - name: Upload visual evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-visual-bootstrap-${{ github.sha }}
          path: artifacts/visual-audit/
          if-no-files-found: warn
          retention-days: 7
