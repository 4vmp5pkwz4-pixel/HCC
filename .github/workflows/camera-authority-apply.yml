name: Apply camera authority closure

on:
  push:
    branches:
      - chatgpt/camera-authority-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/camera-authority-closure
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited camera-authority codemod
        run: node scripts/apply-camera-authority-closure.mjs
      - name: Regenerate extracted kernels if the source projection changed
        run: node scripts/extract-kernels.mjs
      - name: Remove one-shot machinery before policy validation
        run: |
          rm .github/workflows/camera-authority-apply.yml
          rm scripts/apply-camera-authority-closure.mjs
      - name: Run lightweight affected-system validation
        env:
          HCC_CI_WORKERS: 4
        run: npm test
      - name: Commit only the audited closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close camera-limit authority across every framing"
          git push origin HEAD:chatgpt/camera-authority-closure
