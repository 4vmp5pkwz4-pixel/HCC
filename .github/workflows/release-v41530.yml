name: Release v4.153.0 Multiphase Solar Control

on:
  push:
    branches:
      - release/4.153.0-multiphase-solar-control
    paths:
      - .github/workflows/release-v41530.yml

permissions:
  contents: write

concurrency:
  group: release-v41530
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@v4
        with:
          ref: release/4.153.0-multiphase-solar-control
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Stamp v4.153.0 into the exact Atlas
        run: node scripts/patch-v41530-release-identity.cjs
      - name: Prove the new Cycles control plane before measuring the release
        run: |
          node docs/verify-multiphase-solar-control.cjs
          node docs/verify-linked-cycle-views.cjs
          node scripts/extract-kernels.mjs --check
      - name: Rebuild the measured static manifest from the running Atlas
        run: node scripts/build-manifest.mjs
      - name: Rebuild API and machine-facing contracts
        run: node scripts/build-api.mjs
      - name: Validate release identity and source contracts
        run: |
          npm test
          node docs/verify-multiphase-solar-control.cjs
      - name: Re-measure liveness
        run: node scripts/liveness.mjs
      - name: Re-measure local sensitivity
        run: node scripts/sensitivity.mjs
      - name: Re-measure cross-laboratory transfers
        run: node scripts/transfers.mjs
      - name: Recompose end-to-end reach
        run: node scripts/reach.mjs
      - name: Regenerate the browser-free agent report
        run: node scripts/demo-agent.mjs
      - name: Verify measured artifacts and hygiene
        run: |
          node docs/verify-liveness-artifact.cjs
          node docs/verify-sensitivity.cjs
          node docs/verify-transfers.cjs
          node scripts/reach.mjs --check
          node scripts/demo-agent.mjs --check
          node scripts/validate.mjs
          git diff --check
      - name: Commit the coherent v4.153.0 release state
        run: |
          git config user.name "HCC Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json api .well-known/mcp.json artifacts/agent-demo-report.json
          if git diff --cached --quiet; then
            echo "No release state changes were produced."
            exit 1
          fi
          git commit -m "release: v4.153.0 multiphase Solar control"
          git push origin HEAD:release/4.153.0-multiphase-solar-control
