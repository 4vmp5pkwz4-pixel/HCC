name: Refresh v4.149 measured artifacts

on:
  push:
    branches:
      - reconcile/4.149-semantic
    paths:
      - '.github/workflows/refresh-v4149-measurements.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-v4149-measurements
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/4.149-semantic
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Confirm the release being measured
        run: |
          node -e "const v=require('./version.json'); if(v.version!=='4.149.0'||v.build!=='semantic-reconciliation-multiview-2026.09.05.2'||v.source!=='main') throw new Error('unexpected release identity '+JSON.stringify(v)); console.log('measuring',v.version,v.build)"
          grep -F 'astOn:false' index.html >/dev/null

      - name: Re-measure per-frame liveness on this exact build
        run: node scripts/liveness.mjs

      - name: Re-measure local input sensitivity on this exact build
        run: node scripts/sensitivity.mjs

      - name: Re-measure declared inter-laboratory transfers on this exact build
        run: node scripts/transfers.mjs

      - name: Recompose reach from the two fresh measured maps
        run: node scripts/reach.mjs

      - name: Prove all four artifacts belong to v4.149.0 and remain internally valid
        run: |
          node docs/verify-liveness-artifact.cjs
          node docs/verify-sensitivity.cjs
          node docs/verify-transfers.cjs
          node docs/verify-reach.cjs

      - name: Preserve semantic reconciliation, Solar GPU and observer geometry
        run: |
          npm test
          node scripts/extract-kernels.mjs --check
          node docs/verify-solar-gpu-safe-default.cjs
          node docs/verify-solar-webgl-buffer-lifetime.cjs
          node docs/verify-observer-scene.mjs

      - name: Browser self-tests remain green after measurement
        run: node scripts/selftest.mjs --list

      - name: Commit measured artifacts only after every release gate is green
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/liveness.json api/sensitivity.json api/transfers.json api/reach.json
          git diff --cached --quiet && { echo 'No measured artifact changes to commit'; exit 0; }
          git commit -m 'chore(release): remeasure v4.149 atlas influence and liveness artifacts'
          git push origin HEAD:reconcile/4.149-semantic
