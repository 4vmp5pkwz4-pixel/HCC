name: Scale continuity TDD

on:
  push:
    branches:
      - fix/v4.235-zero-debt-invariant-closure
    paths:
      - .github/workflows/scale-continuity-tdd.yml
      - docs/verify-scale-continuity.cjs
      - scripts/apply-scale-continuity-fix.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply scale-continuity implementation
        run: node scripts/apply-scale-continuity-fix.mjs
      - name: Verify scale continuity and finite S3 handoff
        run: node docs/verify-scale-continuity.cjs
      - name: Validate atlas source
        run: node scripts/validate.mjs
      - name: Run source regression suite
        run: npm test
      - name: Commit verified atlas transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: extend scale chain through finite S3 carrier"
          git push
