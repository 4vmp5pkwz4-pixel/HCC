name: Scale continuity TDD

on:
  push:
    branches:
      - fix/v4.235-zero-debt-invariant-closure
    paths:
      - .github/workflows/scale-continuity-tdd.yml
      - docs/verify-scale-continuity.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node docs/verify-scale-continuity.cjs
