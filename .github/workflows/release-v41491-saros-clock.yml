name: Release v4.149.1 — Saros global clock

on:
  push:
    branches:
      - release/4.149.1-saros-clock-sync
    paths:
      - '.github/workflows/release-v41491-saros-clock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v41491-saros-clock
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.149.1-saros-clock-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch the Saros engine onto the one Atlas epoch
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='index.html';
          let s=fs.readFileSync(p,'utf8');
          const old=`let sarosT=0;
          function updateSarosEngine(dt){
            sarosT+=dt;
            const S=cycSarosInst.userData.series;
            /* one full sweep of the animation is one Saros */
            const u=(sarosT*0.08)%1, days=u*S.saros.days;`;
          const neu=`function updateSarosEngine(){
            const S=cycSarosInst.userData.series;
            /* ONE UNIVERSE, ONE CLOCK.  The first implementation accumulated its own
               render-frame time, so this instrument kept moving while the Atlas was
               paused and ignored the global speed/epoch controls.  A Saros is a relation
               among periods, not a separate clock.  Anchor the mechanism to the same
               epochDays authority used by every other Cycles instrument.  Using the full
               elapsed interval also preserves the real accumulated node/anomaly miss. */
            const anchor=cycleByKey('saros')?.ref||0;
            const epoch=Number.isFinite(state.epochDays)?state.epochDays:anchor;
            const days=epoch-anchor;
            const u=((days/S.saros.days)%1+1)%1;`;
          if(!s.includes(old)) throw new Error('Saros independent-clock anchor not found exactly once');
          if(s.indexOf(old)!==s.lastIndexOf(old)) throw new Error('Saros independent-clock anchor is not unique');
          s=s.replace(old,neu);
          const oldPhase=`const ph=(days/h.period)%1, a=-2*Math.PI*ph;`;
          const newPhase=`const ph=((days/h.period)%1+1)%1, a=-2*Math.PI*ph;`;
          if(!s.includes(oldPhase)) throw new Error('Saros phase anchor not found');
          s=s.replace(oldPhase,newPhase);
          s=s.replace('if(cycSarosInst.visible) updateSarosEngine(dt);','if(cycSarosInst.visible) updateSarosEngine();');
          s=s.replace('The Saros drawn as the thing it is: three hands turning at the synodic, draconic and anomalistic months, and a Saros is where they nearly come back together.',
            'The Saros drawn as the thing it is: three hands evaluated at the shared Cycles epoch with synodic, draconic and anomalistic periods, and a Saros is where they nearly come back together.');
          const oldSub='`one sweep = one Saros = <b>${S.saros.days.toFixed(4)} d</b> · `';
          const newSub='`shared Atlas epoch · Saros phase <b>${(u*100).toFixed(1)}%</b> · recurrence ${S.saros.days.toFixed(4)} d · `';
          if(!s.includes(oldSub)) throw new Error('Saros subtitle anchor not found');
          s=s.replace(oldSub,newSub);
          const oldVersion='4.149.0', newVersion='4.149.1';
          const oldBuild='semantic-reconciliation-multiview-2026.09.05.2';
          const newBuild='cycles-saros-global-clock-2026.09.05.1';
          if((s.split(oldVersion).length-1)<2) throw new Error('version anchors missing');
          if((s.split(oldBuild).length-1)<3) throw new Error('build anchors missing');
          s=s.split(oldVersion).join(newVersion).split(oldBuild).join(newBuild);
          for(const dead of ['let sarosT=0;','function updateSarosEngine(dt){','const u=(sarosT*0.08)%1'])
            if(s.includes(dead)) throw new Error(`private Saros frame-clock code survived: ${dead}`);
          if(!/function updateSarosEngine\(\)[\s\S]{0,1800}state\.epochDays/.test(s)) throw new Error('Saros engine is not bound to state.epochDays');
          fs.writeFileSync(p,s);
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          v.version=newVersion; v.build=newBuild; v.source='main';
          fs.writeFileSync('version.json',JSON.stringify(v,null,2)+'\n');
          const manifest=JSON.parse(fs.readFileSync('api/manifest.json','utf8'));
          manifest.version=newVersion; manifest.build=newBuild;
          fs.writeFileSync('api/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
          git diff --check

      - name: Prove one-clock Saros behavior from the shipped formula
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const s=fs.readFileSync('index.html','utf8');
          for(const dead of ['let sarosT=0;','function updateSarosEngine(dt){','const u=(sarosT*0.08)%1'])
            assert(!s.includes(dead),`private Saros frame-clock code remains: ${dead}`);
          const start=s.indexOf('function updateSarosEngine(){');
          assert(start>=0,'updateSarosEngine() missing');
          const body=s.slice(start,start+2600);
          assert(body.includes("cycleByKey('saros')"),'registered Saros anchor missing');
          assert(body.includes('state.epochDays'),'global epoch authority missing');
          assert(body.includes('const days=epoch-anchor;'),'shared elapsed-time coordinate missing');
          assert(body.includes('const ph=((days/h.period)%1+1)%1'),'hand phase must be derived from shared elapsed time');
          assert(s.includes('if(cycSarosInst.visible) updateSarosEngine();'),'frame loop must not inject private dt');
          const periods=[29.530588853,27.212220817,27.554549878];
          const anchor=6585.3211;
          const angles=epoch=>periods.map(period=>-2*Math.PI*(((((epoch-anchor)/period)%1)+1)%1));
          const epoch=anchor+123.456;
          const frozenA=angles(epoch), frozenB=angles(epoch), moved=angles(epoch+17.25);
          assert.deepEqual(frozenB,frozenA,'same global epoch must give identical Saros transforms');
          assert(moved.some((x,i)=>Math.abs(x-frozenB[i])>1e-8),'changing global epoch must move the Saros transforms');
          assert(s.includes("const HCC_VERSION='4.149.1'"),'release version missing');
          assert(s.includes("const HCC_BUILD='cycles-saros-global-clock-2026.09.05.1'"),'release build missing');
          const m=JSON.parse(fs.readFileSync('api/manifest.json','utf8'));
          assert.equal(m.version,'4.149.1');
          assert.equal(m.build,'cycles-saros-global-clock-2026.09.05.1');
          console.log('Saros behavioral contract GREEN: shared epoch freezes/moves deterministically.');
          NODE

      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Existing Atlas, Cycles and Solar contracts remain green
        run: |
          npm test
          node docs/verify-cycles-mechanism.cjs
          node docs/verify-solar-gpu-safe-default.cjs
          node docs/verify-solar-webgl-buffer-lifetime.cjs

      - name: Commit v4.149.1 only after the fix is proven
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json api/manifest.json
          git commit -m 'Release v4.149.1 — synchronize Saros Engine with Atlas time'
          git push origin HEAD:release/4.149.1-saros-clock-sync
