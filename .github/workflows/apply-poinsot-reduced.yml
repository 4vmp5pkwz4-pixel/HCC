name: Apply Poinsot reduced-geometry patch
on:
  push:
    branches: [chatgpt/poinsot-reduced-geometry]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/poinsot-reduced-geometry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply-poinsot-reduced.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make reduced Euler-top geometry visible and honest"
          git push origin HEAD:chatgpt/poinsot-reduced-geometry
