name: Verify v4.155 Predictive Reach
on:
  push:
    branches: [release/4.155.0-predictive-reach-observatory]
    paths:
      - 'core/prediction/**'
      - 'docs/verify-predictive-reach-observatory.cjs'
      - 'scripts/fragments/v41550-predictive-reach.jsfrag'
      - 'scripts/patch-v41550-predictive-reach.cjs'
      - '.github/workflows/verify-v41550-predictive.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node docs/verify-predictive-reach-observatory.cjs
