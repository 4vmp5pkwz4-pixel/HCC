name: Materialize v4.153 multiphase Solar control

on:
  push:
    branches:
      - release/4.153.0-multiphase-solar-control
    paths:
      - scripts/patch-v41530-multiphase-solar-control.cjs
      - scripts/fragments/v41530-multiphase-browser.jsfrag

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.153.0-multiphase-solar-control
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize browser control plane
        run: node scripts/patch-v41530-multiphase-solar-control.cjs
      - name: Verify multiphase contract
        run: node docs/verify-multiphase-solar-control.cjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit exact index
        run: |
          if git diff --quiet -- index.html; then
            echo "index already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(cycles): materialize multiphase Solar control"
          git push origin HEAD:release/4.153.0-multiphase-solar-control
