name: One-shot rendered visual audit

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  visual:
    if: github.event.pull_request.head.ref == 'chatgpt/rendered-visual-audit-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install visual-audit browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Render the 12-case visual matrix
        run: npm run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-visual-audit-one-shot
          path: artifacts/visual-audit
          if-no-files-found: warn
          retention-days: 14
