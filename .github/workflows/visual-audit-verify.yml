name: Verify visual audit matrix

on:
  push:
    branches:
      - chatgpt/visual-audit-matrix

permissions:
  contents: write

jobs:
  visual:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/visual-audit-matrix
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install visual audit runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run rendered visual audit
        id: audit
        continue-on-error: true
        run: npm run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-visual-audit-final
          path: artifacts/visual-audit
          if-no-files-found: error
      - name: Remove one-shot workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/visual-audit-verify.yml
          git commit -m "Remove one-shot visual verification workflow"
          git push
      - name: Preserve audit failure
        if: ${{ always() && steps.audit.outcome == 'failure' }}
        run: exit 1
