name: Fix Solar Observable black gap

on:
  push:
    branches:
      - fix/solar-observable-black-gap
    paths:
      - .github/workflows/fix-solar-observable-black-gap.yml
      - scripts/apply-solar-observable-black-gap-fix.mjs
      - docs/verify-scale-continuity.cjs
      - docs/BLACK_GAP_ROOT_CAUSE.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dimensional-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prove current branch reproduces the black corridor
        shell: bash
        run: |
          set +e
          node docs/verify-scale-continuity.cjs > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo "Expected pre-fix regression to fail, but it passed."
            exit 1
          fi
          grep -q "Solar/Observable seam is expressed in Gly at Local-Group scale" /tmp/red.log
      - name: Apply dimensional seam correction
        run: node scripts/apply-solar-observable-black-gap-fix.mjs
      - name: Verify focused scale invariant
        run: node docs/verify-scale-continuity.cjs
      - name: Validate atlas source
        run: node scripts/validate.mjs
      - name: Remove one-shot repair machinery
        run: git rm scripts/apply-solar-observable-black-gap-fix.mjs .github/workflows/fix-solar-observable-black-gap.yml
      - name: Run full source regression suite on final tree
        run: npm test
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/verify-scale-continuity.cjs docs/BLACK_GAP_ROOT_CAUSE.md
          git add -u
          git commit -m "fix: eliminate Solar to Observable black scale corridor"
          git push
