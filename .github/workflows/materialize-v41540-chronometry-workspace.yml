name: Materialize v4.154 chronometry workspace

on:
  push:
    branches:
      - release/4.154.0-chronometry-workspace
    paths:
      - scripts/patch-v41540-chronometry-workspace.cjs
      - scripts/fragments/v41540-chronometry-workspace.jsfrag
      - .github/workflows/materialize-v41540-chronometry-workspace.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.154.0-chronometry-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify inherited source-locked Phase A
        run: |
          node docs/verify-chronometry-source-locked.cjs
          node docs/verify-chronometry-falsification.cjs
          node docs/verify-ancient-astronomy-benchmarks.cjs
      - name: Materialize Phase B and workspace persistence
        run: node scripts/patch-v41540-chronometry-workspace.cjs
      - name: Verify integrated browser contract
        run: node docs/verify-chronometry-workspace-v41540.cjs
      - name: Preserve v4.153 multiphase and Time Fabric contracts
        run: |
          node docs/verify-multiphase-solar-control.cjs
          node docs/verify-unified-atlas-time.cjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit exact index
        run: |
          if git diff --quiet -- index.html; then
            echo "index already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(chronometry): materialize source-locked observatory workspace"
          git push origin HEAD:release/4.154.0-chronometry-workspace
