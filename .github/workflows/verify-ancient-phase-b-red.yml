name: Verify Ancient Chronometry Phase B RED

on:
  push:
    branches:
      - reconcile/4.150-ancient-chronometry
    paths:
      - '.github/workflows/verify-ancient-phase-b-red.yml'
      - 'docs/reconcile-ancient-phase-b-red.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase B must be RED before implementation
        run: node docs/reconcile-ancient-phase-b-red.cjs
