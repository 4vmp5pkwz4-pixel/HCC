name: Diagnose zero-debt

on:
  push:
    branches:
      - fix/v4.235-zero-debt-invariant-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Print exact runtime diagnostics
        run: node scripts/diagnose-selftest-once.mjs
