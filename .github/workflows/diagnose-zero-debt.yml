name: Diagnose zero-debt

on:
  push:
    branches:
      - fix/v4.235-zero-debt-invariant-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser self-tests
        run: node scripts/selftest.mjs --list
