name: Diagnose zero-debt

on:
  push:
    branches:
      - fix/v4.235-zero-debt-invariant-closure
    paths:
      - .github/workflows/diagnose-zero-debt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply invariant-first repairs
        run: node scripts/apply-zero-debt-fixes.mjs
      - name: Validate source contract before commit
        run: node scripts/validate.mjs
      - name: Commit repaired atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: close six zero-debt regressions"
          git push
