name: Diagnose zero-debt

on:
  push:
    branches:
      - fix/v4.235-zero-debt-invariant-closure
    paths:
      - .github/workflows/diagnose-zero-debt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/diagnose-index-snippets.mjs
