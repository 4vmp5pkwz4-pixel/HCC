name: Diagnose zero-debt

on:
  push:
    branches:
      - fix/v4.235-zero-debt-invariant-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print source context for failing invariants
        run: node scripts/diagnose-index-snippets.mjs
