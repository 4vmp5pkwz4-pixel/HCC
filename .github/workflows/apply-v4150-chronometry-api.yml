name: Apply v4.150 Chronometry API adapter

on:
  push:
    branches:
      - release/4.150.0-ancient-chronometry
    paths:
      - '.github/workflows/apply-v4150-chronometry-api.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v4150-chronometry-api
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.150.0-ancient-chronometry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add the source-locked Chronometry projection to HCC_API
        run: |
          node .github/scripts/apply-v4150-chronometry-api.cjs
          git diff --check
      - name: Prove the adapter against the Phase-A authority
        run: |
          node docs/verify-chronometry-atlas-contract.cjs
          node docs/verify-chronometry-source-locked.cjs
          node docs/verify-chronometry-falsification.cjs
          node docs/verify-ancient-astronomy-benchmarks.cjs
          npm test
      - name: Commit only after the source-locked contract is green
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(api): publish source-locked chronometry contract'
          git push origin HEAD:release/4.150.0-ancient-chronometry
