name: Verify Ancient Chronometry Phase A

on:
  push:
    branches:
      - reconcile/4.150-ancient-chronometry
    paths:
      - '.github/workflows/verify-ancient-phase-a.yml'
      - 'core/labs/chronometry.source_locked.mjs'
      - 'docs/data/ancient-astronomy-benchmarks.json'
      - 'docs/data/ancient-chronometry-sources.json'
      - 'docs/verify-ancient-astronomy-benchmarks.cjs'
      - 'docs/verify-chronometry-falsification.cjs'
      - 'docs/verify-chronometry-source-locked.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-locked registry and exact-rational kernel
        run: node docs/verify-chronometry-source-locked.cjs
      - name: Falsification firewall and dependent-hypothesis rules
        run: node docs/verify-chronometry-falsification.cjs
      - name: Ancient astronomy benchmark registry
        run: node docs/verify-ancient-astronomy-benchmarks.cjs
      - name: No shared production files were touched by Phase A transplant
        run: |
          git diff --check HEAD~1 HEAD
          test -f core/labs/chronometry.source_locked.mjs
          test -f docs/data/ancient-chronometry-sources.json
          test -f docs/data/ancient-astronomy-benchmarks.json
