name: Visual Solar Observable seam

on:
  push:
    branches:
      - fix/solar-observable-visual-seam-20260912

permissions:
  contents: read

jobs:
  visual-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove the visual guard catches the old 26-Gly defect
        run: |
          if HCC_VISUAL_SEAM_MUTATION=26 node docs/verify-solar-observable-visual-seam.cjs; then
            echo 'ERROR: visual regression guard passed with the old 26-Gly seam restored'
            exit 1
          else
            echo 'PASS: visual regression guard fails when the old 26-Gly seam is restored'
          fi
      - name: Render and verify the corrected seam
        run: node docs/verify-solar-observable-visual-seam.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-observable-visual-seam
          path: artifacts/visual-seam/*.png
          if-no-files-found: error
          retention-days: 7
