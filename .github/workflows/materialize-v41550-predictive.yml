name: Materialize v4.155 Predictive Reach
on:
  push:
    branches: [release/4.155.0-predictive-reach-observatory]
    paths:
      - 'core/prediction/reach-forecast.mjs'
      - 'scripts/fragments/v41550-predictive-reach.jsfrag'
      - 'scripts/patch-v41550-predictive-reach.cjs'
      - 'docs/verify-predictive-reach-observatory.cjs'
      - '.github/workflows/materialize-v41550-predictive.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.155.0-predictive-reach-observatory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize exact browser surface
        run: node scripts/patch-v41550-predictive-reach.cjs
      - name: Verify new scientific contract
        run: node docs/verify-predictive-reach-observatory.cjs
      - name: Validate the full Atlas
        run: |
          git diff --check
          node scripts/validate.mjs
      - name: Commit materialized Atlas
        run: |
          if git diff --quiet -- index.html; then echo 'index already materialized'; exit 0; fi
          git config user.name 'HCC Release Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(prediction): materialize predictive reach observatory'
          git push origin HEAD:release/4.155.0-predictive-reach-observatory
