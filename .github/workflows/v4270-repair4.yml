name: v4.270 repair minimal

on:
  push:
    branches:
      - chatgpt/v4.270-self-description-authority

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python3 scripts/v4270-fix-helper.py
      - name: Apply and verify
        run: |
          python3 scripts/v4270-one-shot.py
          node scripts/build-api.mjs
          rm -f .github/workflows/v4270-repair.yml
          rm -f .github/workflows/v4270-repair2.yml
          rm -f .github/workflows/v4270-repair3.yml
          rm -f .github/workflows/v4270-repair4.yml
          npm run test:release
          node docs/verify-self-description-authority.mjs
          git diff --check
      - name: Commit verified repair
        run: |
          rm -f scripts/v4270-one-shot.py
          rm -f scripts/v4270-fix-helper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Self-description has one authority · v4.270.0"
          git push origin HEAD:chatgpt/v4.270-self-description-authority
