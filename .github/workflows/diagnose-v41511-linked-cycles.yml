name: Diagnose v4.151.1 linked cycle views

on:
  push:
    branches:
      - release/4.151.1-linked-cycle-views
    paths:
      - .github/workflows/diagnose-v41511-linked-cycles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/4.151.1-linked-cycle-views
      - name: Extract Cycles integration hooks
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const needles=[
            'Integrated Information',
            'Integrated Complexity',
            'Unified Scaling',
            'Observer Selection',
            'cycSarosInst',
            'function updateCycles',
            'function updateCyc',
            "frame==='hierarchy'",
            'cycFrame',
            'epochDays',
            'cycleByKey',
            'CYCLES',
            'setCyc',
            'renderCyc'
          ];
          for(const needle of needles){
            let from=0, seen=0;
            while(seen<4){
              const i=s.indexOf(needle,from);
              if(i<0) break;
              console.log(`\n===== ${needle} @ ${i} #${seen+1} =====`);
              console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+3200)));
              from=i+needle.length; seen++;
            }
            if(!seen) console.log(`\n===== ${needle}: NOT FOUND =====`);
          }
          NODE
