name: Materialize v4.152 API wiring fix

on:
  push:
    branches:
      - feat/unified-atlas-time-4.152
    paths:
      - scripts/patch-v41520-integration-time.cjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch the materialized AtlasTime API wiring
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='index.html';
          let s=fs.readFileSync(p,'utf8');
          const bad="setEpochDays(dayJ2000,provenance='time-fabric.api.setEpochDays'){setAtlasEpochDays(dayJ2000,provenance);return this.snapshot();}";
          const good="setEpochDays(dayJ2000,provenance='time-fabric.api.setEpochDays'){setAtlasEpoch(dayJ2000,provenance);return this.snapshot();}";
          const n=s.split(bad).length-1;
          if(n===1){s=s.replace(bad,good);fs.writeFileSync(p,s);}
          else if(!s.includes(good))throw new Error(`AtlasTime API wiring anchor count ${n}`);
          NODE
          git diff --check
          node scripts/validate.mjs
          node docs/verify-unified-atlas-time.cjs
      - name: Commit materialized fix
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "API wiring already correct"
            exit 0
          fi
          git config user.name "HCC Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(time): wire public epoch API to Atlas mutation gateway"
          git push origin HEAD:feat/unified-atlas-time-4.152
