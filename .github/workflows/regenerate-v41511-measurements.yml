name: Regenerate v4.151.1 measured artifacts

on:
  push:
    branches:
      - release/4.151.1-linked-cycle-views
    paths:
      - .github/workflows/regenerate-v41511-measurements.yml

permissions:
  contents: write

concurrency:
  group: regenerate-v41511-measurements
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@v4
        with:
          ref: release/4.151.1-linked-cycle-views
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Measure liveness from v4.151.1
        run: node scripts/liveness.mjs
      - name: Measure sensitivity from v4.151.1
        run: node scripts/sensitivity.mjs
      - name: Measure transfers from v4.151.1
        run: node scripts/transfers.mjs
      - name: Verify freshly measured artifacts
        run: |
          node docs/verify-liveness-artifact.cjs
          node docs/verify-sensitivity.cjs
          node docs/verify-transfers.cjs
      - name: Confirm release and linked-view gates still pass
        run: |
          node docs/verify-linked-cycle-views.cjs
          npm test
          git diff --check
      - name: Commit measured artifacts
        run: |
          git config user.name "HCC Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add api/liveness.json api/sensitivity.json api/transfers.json
          if git diff --cached --quiet; then
            echo "No measured artifact changes to commit."
            exit 1
          fi
          git commit -m "release: refresh v4.151.1 measured artifacts"
          git push origin HEAD:release/4.151.1-linked-cycle-views
