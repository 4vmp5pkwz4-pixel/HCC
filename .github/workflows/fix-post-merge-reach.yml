name: Fix post-merge reach v4.151.1

on:
  push:
    branches:
      - fix/post-merge-reach-4.151.1
    paths:
      - .github/workflows/fix-post-merge-reach.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-merge-reach-4.151.1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove stale reach reproduces before repair
        run: |
          if node scripts/reach.mjs --check; then
            echo '::error::Expected stale api/reach.json, but the RED test unexpectedly passed.'
            exit 1
          fi

      - name: Regenerate reach from current measured sources
        run: |
          node scripts/reach.mjs
          node scripts/reach.mjs --check

      - name: Remove one-shot release workflows before commit
        run: |
          rm -f .github/workflows/regenerate-v41511-measurements.yml
          rm -f .github/workflows/fix-post-merge-reach.yml

      - name: Commit only derived repair and workflow cleanup
        run: |
          git config user.name 'HCC Release Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add api/reach.json .github/workflows/regenerate-v41511-measurements.yml .github/workflows/fix-post-merge-reach.yml
          git diff --cached --stat
          git commit -m 'fix: refresh reach composition after v4.151.1 measurements'
          git push origin HEAD:fix/post-merge-reach-4.151.1
