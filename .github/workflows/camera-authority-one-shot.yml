name: Camera authority one-shot

on:
  push:
    branches:
      - chatgpt/camera-authority-strict

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply atomic source patch
        run: node scripts/patch-camera-authority-v2.mjs
      - name: Verify camera authority and seams
        run: |
          node docs/verify-camera-limit-authority.cjs
          node docs/verify-scale-continuity.cjs
          node docs/verify-the-seam-lands-at-the-observer.cjs
          node docs/verify-a-framing-is-not-a-gesture.cjs
          node scripts/extract-kernels.mjs --check
          node scripts/validate.mjs
      - name: Commit audited source and remove one-shot machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/camera-authority-one-shot.yml scripts/patch-camera-authority-v2.mjs
          git commit -m "Apply strict camera-limit authority to Atlas source"
          git push origin HEAD:chatgpt/camera-authority-strict
