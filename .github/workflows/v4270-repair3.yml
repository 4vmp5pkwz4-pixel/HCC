name: v4.270 repair structural retry

on:
  push:
    branches:
      - chatgpt/v4.270-self-description-authority

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Remove markdown-format dependency from repair matcher
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/v4270-one-shot.py')
          s=p.read_text()
          old="""sub_once('README.md',
    r'The live laboratory registry is authoritative: \\*\\*\\d+ laboratories across \\d+ worlds\\*\\* at the\\s+v\\d+\\.\\d+\\.\\d+ release boundary\\. The generated `api/manifest\\.json` is measured by walking the\\s+application headlessly; prose counts are descriptive, never an independent source of truth\\.',
    'The live census is `api/manifest.json` (`counts.laboratories`, `counts.instruments`,\\n`counts.worlds`) at the release declared by `version.json`. The manifest is measured by walking\\nthe application headlessly; prose counts are descriptive, never an independent source of truth.', re.S)"""
          new="""sub_once('README.md',
    r'The live laboratory registry is authoritative: \\*\\*\\d+ laboratories across \\d+ worlds\\*\\* at the\\s+v\\d+\\.\\d+\\.\\d+ release boundary\\.',
    'The live census is `api/manifest.json` (`counts.laboratories`, `counts.instruments`, `counts.worlds`) at the release declared by `version.json`.')"""
          if s.count(old)!=1: raise SystemExit(f'expected one helper block, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply and verify v4.270
        run: |
          python3 scripts/v4270-one-shot.py
          node scripts/build-api.mjs
          npm run test:release
          node docs/verify-self-description-authority.mjs
          git diff --check
      - name: Commit verified repair
        run: |
          rm -f .github/workflows/v4270-repair.yml .github/workflows/v4270-repair2.yml .github/workflows/v4270-repair3.yml scripts/v4270-one-shot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Self-description has one authority · v4.270.0"
          git push origin HEAD:chatgpt/v4.270-self-description-authority
