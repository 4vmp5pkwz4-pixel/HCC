name: Refresh v4.152.0 release artifacts

on:
  push:
    branches:
      - feat/unified-atlas-time-4.152
    paths:
      - version.json

permissions:
  contents: write

concurrency:
  group: refresh-v41520-artifacts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@v4
        with:
          ref: feat/unified-atlas-time-4.152
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Regenerate measured artifacts
        run: |
          set -euo pipefail
          node scripts/liveness.mjs
          node scripts/sensitivity.mjs
          node scripts/transfers.mjs
          node scripts/reach.mjs
      - name: Regenerate machine-facing contracts
        run: |
          set -euo pipefail
          node scripts/build-api.mjs
          node scripts/reach.mjs
      - name: Verify regenerated release artifacts
        run: |
          set -euo pipefail
          node docs/verify-liveness-artifact.cjs
          node docs/verify-sensitivity.cjs
          node docs/verify-transfers.cjs
          node scripts/reach.mjs --check
          node scripts/build-manifest.mjs --check
          node docs/verify-unified-atlas-time.cjs
          node docs/verify-atlas-integration-bus.cjs
          node docs/verify-linked-cycle-views.cjs
          node scripts/validate.mjs
          git diff --check
      - name: Commit release artifacts
        run: |
          set -euo pipefail
          git config user.name "HCC Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add api/liveness.json api/sensitivity.json api/transfers.json api/reach.json api/manifest.json api/openapi.json api/open-problems.json .well-known/mcp.json
          if git diff --cached --quiet; then
            echo "No release artifact changes to commit."
            exit 0
          fi
          git commit -m "release: refresh v4.152.0 measured artifacts and reach"
          git push origin HEAD:feat/unified-atlas-time-4.152
