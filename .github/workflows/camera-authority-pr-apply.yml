name: Apply camera authority closure on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/camera-authority-closure-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict camera authority closure
        run: node scripts/apply-camera-authority-closure.mjs
      - name: Regenerate extracted kernels
        run: node scripts/extract-kernels.mjs
      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/camera-authority-pr-apply.yml
          rm scripts/apply-camera-authority-closure.mjs
      - name: Verify camera and scale invariants
        run: |
          node scripts/verify-ci-policy.mjs
          node scripts/validate.mjs
          node docs/verify-camera-limit-authority.cjs
          node docs/verify-camera-limit-provenance.cjs
          node docs/verify-the-camera.cjs
          node docs/verify-scale-continuity.cjs
          node docs/verify-the-seam-lands-at-the-observer.cjs
          node docs/verify-no-void-past-the-last-structure.cjs
          git diff --check
      - name: Commit final closure to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close camera-limit authority across every framing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
