name: Apply camera authority PR closure

on:
  pull_request_target:
    types: [edited]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 371 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/camera-authority-closure
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited camera-authority closure
        run: |
          node scripts/apply-camera-authority-closure.mjs
          node scripts/extract-kernels.mjs
          rm -f .github/workflows/camera-authority-apply.yml
          rm -f scripts/apply-camera-authority-closure.mjs
      - name: Validate final PR tree
        env:
          HCC_CI_WORKERS: 4
        run: npm test
      - name: Commit final PR tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close camera-limit authority across every framing"
          git push origin HEAD:chatgpt/camera-authority-closure
      - name: Remove this one-shot workflow from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/camera-authority-pr-apply.yml
          git commit -m "Remove camera-authority PR apply workflow"
          git push origin main
