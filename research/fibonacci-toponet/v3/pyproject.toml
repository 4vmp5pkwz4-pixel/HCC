[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibonacci-toponet-v3-research"
version = "0.3.0"
description = "Experimental causal multiscale attention with stable selective memory and explicit finite-group invariant heads"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3"]

[tool.setuptools]
py-modules = ["fibonacci_topo_net_v3"]